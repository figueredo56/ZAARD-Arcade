<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAARD: Golden Run</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #game-container { width: 100%; max-width: 800px; height: 500px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); border-radius: 12px; overflow: hidden; border: 2px solid #334155; position: relative; background: #1e293b; }
        .hud-bar { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #1e293b; border-top-left-radius: 12px; border-top-right-radius: 12px; border: 2px solid #334155; border-bottom: none; }
        .btn-web3 { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.3); }
        .btn-web3:hover { opacity: 0.9; transform: translateY(-1px); }
        .lang-select { background: #334155; color: #fff; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="hud-bar">
        <div>
            <button id="connectWallet" class="btn-web3">Conectar Wallet</button>
            <span id="walletAddress" style="font-size: 0.85rem; color: #94a3b8; margin-left: 10px;">No conectado</span>
        </div>
        <div>
            <select id="langSelect" class="lang-select">
                <option value="es">Español</option>
                <option value="en">English</option>
                <option value="zh">中文</option>
            </select>
        </div>
    </div>

    <div id="game-container"></div>

    <script>
        let zaard_lang = 'es';
        let userAccount = null;
        let provider = null;

        const trads = {
            es: { title: "ZAARD: GOLDEN RUN", score: "Puntuación", shields: "Escudos", tap: "¡Mueve para esquivar y atrapar oro!", btnStart: "JUGAR", gameOver: "¡JUEGO TERMINADO!", restart: "Click para reiniciar" },
            en: { title: "ZAARD: GOLDEN RUN", score: "Score", shields: "Shields", tap: "Move to dodge and collect gold!", btnStart: "PLAY", gameOver: "GAME OVER", restart: "Click to restart" },
            zh: { title: "ZAARD: GOLDEN RUN", score: "得分", shields: "护盾", tap: "移动躲避并收集黄金！", btnStart: "开始", gameOver: "游戏结束", restart: "点击重试" }
        };

        document.getElementById('langSelect').addEventListener('change', (e) => {
            zaard_lang = e.target.value;
        });

        document.getElementById('connectWallet').addEventListener('click', async () => {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    const accounts = await provider.send("eth_requestAccounts", []);
                    userAccount = accounts[0];
                    document.getElementById('walletAddress').innerText = userAccount.substring(0, 6) + "..." + userAccount.substring(38);
                    document.getElementById('connectWallet').innerText = "Conectado";
                } catch (err) {
                    console.error(err);
                }
            } else {
                alert("Por favor instala MetaMask");
            }
        });

        class BootScene extends Phaser.Scene {
            constructor() { super('BootScene'); }
            create() { this.scene.start('GameScene'); }
        }

        class GameScene extends Phaser.Scene {
            constructor() { super('GameScene'); }
            
            create() {
                this.score = 0;
                this.shields = 3;
                this.isGameOver = false;

                // Fondo dinámico
                this.add.rectangle(400, 250, 800, 500, 0x0f172a);
                
                // Jugador (Nave/Personaje ZAARD)
                this.player = this.add.rectangle(400, 420, 50, 30, 0xf59e0b);
                this.physics.add.existing(this.player);
                this.player.body.setCollideWorldBounds(true);

                // Grupos
                this.golds = this.physics.add.group();
                this.obstacles = this.physics.add.group();

                // Textos HUD
                this.scoreText = this.add.text(20, 20, `${trads[zaard_lang].score}: 0`, { fontSize: '18px', fill: '#f8fafc' });
                this.shieldText = this.add.text(20, 50, `${trads[zaard_lang].shields}: 3`, { fontSize: '18px', fill: '#38bdf8' });

                // Controles Táctiles y Mouse
                this.input.on('pointermove', (pointer) => {
                    if (!this.isGameOver) {
                        this.player.x = Phaser.Math.Clamp(pointer.x, 30, 770);
                    }
                });

                // Spawns
                this.time.addEvent({ delay: 800, callback: this.spawnGold, callbackScope: this, loop: true });
                this.time.addEvent({ delay: 1200, callback: this.spawnObstacle, callbackScope: this, loop: true });

                // Colisiones
                this.physics.add.overlap(this.player, this.golds, this.collectGold, null, this);
                this.physics.add.overlap(this.player, this.obstacles, this.hitObstacle, null, this);
            }

            spawnGold() {
                if (this.isGameOver) return;
                let x = Phaser.Math.Between(30, 770);
                let gold = this.add.circle(x, -20, 12, 0x10b981);
                this.physics.add.existing(gold);
                gold.body.setVelocityY(200);
                this.golds.add(gold);
            }

            spawnObstacle() {
                if (this.isGameOver) return;
                let x = Phaser.Math.Between(30, 770);
                let obs = this.add.rectangle(x, -20, 35, 35, 0xef4444);
                this.physics.add.existing(obs);
                obs.body.setVelocityY(250);
                this.obstacles.add(obs);
            }

            collectGold(player, gold) {
                gold.destroy();
                this.score += 10;
                this.scoreText.setText(`${trads[zaard_lang].score}: ${this.score}`);
            }

            hitObstacle(player, obs) {
                obs.destroy();
                this.shields -= 1;
                this.shieldText.setText(`${trads[zaard_lang].shields}: ${this.shields}`);
                if (this.shields <= 0) {
                    this.gameOver();
                }
            }

            gameOver() {
                this.isGameOver = true;
                this.physics.pause();
                this.add.text(400, 220, trads[zaard_lang].gameOver, { fontSize: '32px', fill: '#ef4444', fontStyle: 'bold' }).setOrigin(0.5);
                let restartText = this.add.text(400, 280, trads[zaard_lang].restart, { fontSize: '18px', fill: '#94a3b8' }).setOrigin(0.5);
                
                this.input.once('pointerdown', () => {
                    this.scene.restart();
                });
            }

            update() {}
        }

        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 500,
            parent: 'game-container',
            physics: { default: 'arcade', arcade: { debug: false } },
            scene: [BootScene, GameScene]
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
