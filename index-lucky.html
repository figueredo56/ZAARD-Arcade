<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAARD Innovation - Caja Misteriosa Web3</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --primary-color: #f3ba2f;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        #btnWallet {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        #btnWallet:hover {
            opacity: 0.8;
        }
        .info-panel {
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            border: 1px solid #333;
            max-width: 500px;
            width: 100%;
            word-break: break-all;
        }
        .grid-cajas {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
            width: 100%;
        }
        .caja {
            background-color: var(--card-bg);
            border: 2px solid #444;
            border-radius: 12px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s ease;
        }
        .caja:hover:not(.abierta) {
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .caja.abierta {
            cursor: default;
        }
        .caja.ganadora {
            background-color: #1b5e20;
            border-color: #4caf50;
        }
        .caja.perdedora {
            background-color: #b71c1c;
            border-color: #f44336;
        }
        #mensaje {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            min-height: 30px;
            padding-bottom: 40px;
        }
        @media (max-width: 600px) {
            .grid-cajas {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>ZAARD Mystery Box</h1>
        <p>Apuesta <strong>0.00001 BNB</strong> y gana <strong>0.5 ZARD</strong> en la caja correcta</p>
    </header>

    <button id="btnWallet" onclick="gestionarConexion()">Conectar Wallet</button>

    <div class="info-panel">
        <p id="walletStatus">Wallet: Desconectada</p>
        <p>Contrato Destino: <small>0x3468ea4e6ce13ec4c7f8651f7efc6aa6046f4d65</small></p>
    </div>

    <div class="grid-cajas" id="gridCajas">
        <!-- Las 12 cajas se cargan dinámicamente -->
    </div>

    <div id="mensaje">Conecta tu billetera para comenzar.</div>

    <script>
        let provider, signer, userAddress;
        let conectado = false;
        
        const DESTINO_CONTRACT = "0x3468ea4e6ce13ec4c7f8651f7efc6aa6046f4d65";
        const APUESTA_BNB = ethers.utils.parseEther("0.00001");
        const CAJA_GANADORA = 4; // Caja #4

        async function gestionarConexion() {
            if (!conectado) {
                await conectarWallet();
            } else {
                desconectarWallet();
            }
        }

        async function conectarWallet() {
            const targetProvider = window.ethereum || window.BinanceChain;

            if (targetProvider) {
                try {
                    provider = new ethers.providers.Web3Provider(targetProvider, "any");
                    await provider.send("eth_requestAccounts", []);
                    
                    signer = provider.getSigner();
                    userAddress = await signer.getAddress();
                    
                    // Protocolo opcional de firma para autenticación y aceptación de términos
                    try {
                        document.getElementById("mensaje").innerText = "Firma el mensaje en tu wallet para validar la sesión...";
                        await signer.signMessage("Bienvenido a ZAARD Innovation - Autorizando acceso al juego de Cajas Misteriosas.");
                    } catch (sigError) {
                        console.log("Firma cancelada o ignorada por el usuario, procediendo con conexión estándar.");
                    }

                    conectado = true;
                    document.getElementById("walletStatus").innerText = `Conectado: ${userAddress.substring(0,6)}...${userAddress.substring(38)}`;
                    const btn = document.getElementById("btnWallet");
                    btn.innerText = "Desconectar Wallet";
                    btn.style.backgroundColor = "#d32f2f";
                    btn.style.color = "#fff";
                    
                    inicializarJuego();
                } catch (error) {
                    console.error(error);
                    alert("Error al conectar la wallet.");
                }
            } else {
                alert("Abre este enlace desde el navegador DApp integrado de tu App de Binance.");
            }
        }

        function desconectarWallet() {
            provider = null;
            signer = null;
            userAddress = null;
            conectado = false;

            document.getElementById("walletStatus").innerText = "Wallet: Desconectada";
            const btn = document.getElementById("btnWallet");
            btn.innerText = "Conectar Wallet";
            btn.style.backgroundColor = "#f3ba2f";
            btn.style.color = "#000";

            document.getElementById("gridCajas").innerHTML = "";
            document.getElementById("mensaje").innerText = "Wallet desconectada.";
        }

        function inicializarJuego() {
            const grid = document.getElementById("gridCajas");
            grid.innerHTML = "";

            for (let i = 1; i <= 12; i++) {
                const caja = document.createElement("div");
                caja.className = "caja";
                caja.innerHTML = `📦<br><span style="font-size: 12px;">#${i}</span>`;
                caja.onclick = () => seleccionarCaja(i, caja);
                grid.appendChild(caja);
            }
            document.getElementById("mensaje").innerText = "¡Elige una caja para apostar 0.00001 BNB!";
        }

        async function seleccionarCaja(numeroCaja, elementoCaja) {
            if (!signer || !conectado) {
                alert("Primero debes conectar tu Wallet.");
                return;
            }

            const mensajeEl = document.getElementById("mensaje");

            try {
                mensajeEl.innerText = "Confirmando apuesta de 0.00001 BNB en la red...";
                
                // Transacción para enviar 0.00001 BNB a la dirección de destino
                const tx = await signer.sendTransaction({
                    to: DESTINO_CONTRACT,
                    value: APUESTA_BNB,
                    gasLimit: ethers.utils.hexlify(100000)
                });

                mensajeEl.innerText = "Transacción en proceso... Esperando bloques de la BSC.";
                await tx.wait();

                // Evaluar resultado de la caja
                if (numeroCaja === CAJA_GANADORA) {
                    elementoCaja.className = "caja abierta ganadora";
                    elementoCaja.innerHTML = `🎉<br><span style="font-size: 12px;">¡Ganaste!</span>`;
                    mensajeEl.innerText = "🏆 ¡Felicidades! Encontraste la caja ganadora #4. ¡Has ganado 0.5 ZARD!";
                } else {
                    elementoCaja.className = "caja abierta perdedora";
                    elementoCaja.innerHTML = `❌<br><span style="font-size: 12px;">Vacía</span>`;
                    mensajeEl.innerText = `Lo siento, era la caja #${numeroCaja}. ¡Sigue intentándolo!`;
                }

                // Desactivar las cajas de la ronda actual
                const cajas = document.querySelectorAll(".caja");
                cajas.forEach(c => c.onclick = null);

                // Botón para jugar de nuevo
                setTimeout(() => {
                    const btnReiniciar = document.createElement("button");
                    btnReiniciar.innerText = "Jugar otra vez";
                    btnReiniciar.style.display = "block";
                    btnReiniciar.style.margin = "15px auto 0 auto";
                    btnReiniciar.style.padding = "8px 15px";
                    btnReiniciar.style.cursor = "pointer";
                    btnReiniciar.style.backgroundColor = "#f3ba2f";
                    btnReiniciar.style.border = "none";
                    btnReiniciar.style.borderRadius = "5px";
                    btnReiniciar.style.fontWeight = "bold";
                    btnReiniciar.style.color = "#000";
                    btnReiniciar.onclick = inicializarJuego;
                    mensajeEl.appendChild(btnReiniciar);
                }, 500);

            } catch (error) {
                console.error(error);
                mensajeEl.innerText = "Transacción cancelada o fondos insuficientes de BNB.";
            }
        }
    </script>
</body>
</html>
