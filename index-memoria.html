<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZAARD MEMORY ARCADE - Protocolo Panga</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0;
            background: radial-gradient(circle at 50% 30%, #3d106b 0%, #17042f 50%, #070112 100%);
            background-attachment: fixed;
            overflow: hidden; 
            font-family: 'Arial', sans-serif; 
            color: #fff;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #070112; z-index: 2000;
            display: flex; justify-content: center; align-items: center; color: #00ffff; font-weight: bold;
        }
        /* Estilos para el modal de bienvenida (Invitado o Billetera Web3) con fondo cósmico elegante */
        #modal-bienvenida {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(7, 1, 18, 0.85);
            background-image: radial-gradient(circle at 50% 50%, rgba(61, 16, 107, 0.4) 0%, rgba(7, 1, 18, 0.9) 100%);
            z-index: 1500;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; text-align: center;
        }
        .modal-card {
            background: linear-gradient(135deg, rgba(36, 10, 74, 0.95) 0%, rgba(16, 3, 35, 0.95) 100%);
            border: 2px solid #00ffff; border-radius: 20px;
            padding: 30px; width: 100%; max-width: 420px;
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.4), inset 0 0 15px rgba(217, 70, 239, 0.2);
            animation: modalGlow 3s infinite alternate;
        }
        @keyframes modalGlow {
            0% { box-shadow: 0 0 25px rgba(0, 255, 255, 0.3); }
            100% { box-shadow: 0 0 40px rgba(217, 70, 239, 0.5); }
        }
        .btn-accion {
            width: 100%; padding: 14px; margin: 12px 0; border: none; border-radius: 12px;
            font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-accion:hover {
            transform: scale(1.02);
        }
        .btn-invitado { background: linear-gradient(90deg, #10b981, #059669); color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .btn-web3 { background: linear-gradient(90deg, #00ffff, #0088cc); color: #000; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        .btn-volver { background: linear-gradient(90deg, #ef4444, #b91c1c); color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>

<div id="loading-screen">CARGANDO PROTOCOLO...</div>

<!-- MODAL DE BIENVENIDA (Invitado vs Billetera y Apuesta) -->
<div id="modal-bienvenida">
    <div class="modal-card">
        <h2 id="txt-titulo-modal" style="color: #00ffff; margin-top: 0; text-shadow: 0 0 10px rgba(0,255,255,0.6);">⚡ PROTOCOLO PANGA ⚡</h2>
        <p id="txt-desc-modal" style="font-size: 15px; color: #ddd; margin-bottom: 20px; line-height: 1.5;">
            ¡Bienvenido al Desafío de Memoria Cósmica!<br>
            Apuesta: 0.0001 ZARD<br>Premio: 0.00015 ZARD<br>Quema automática al perder.
        </p>
        <button class="btn-accion btn-invitado" onclick="elegirModo('invitado')">MODO INVITADO 🚀</button>
        <button class="btn-accion btn-web3" onclick="conectarYJugar()">CONECTAR BILLETERA WEB3</button>
        <button class="btn-accion btn-volver" onclick="irAlMenuArcade()">⬅ VOLVER AL MENÚ ARCADE</button>
    </div>
</div>

<audio id="zaard-audio" loop>
    <source src="El%20Chupulún%20de%20Zaard.mp3" type="audio/mpeg">
</audio>

<!-- Audio efectos de sonido con Web Audio API para máxima calidad sin depender de archivos externos -->
<script>
    const LS_NOMBRE = localStorage.getItem('zaard_nombre') || "Jugador Zaard";
    const LS_AVATAR_URL = localStorage.getItem('zaard_avatar') || 'https://raw.githubusercontent.com/figueredo56/ZAARD-Arcade/refs/heads/main/Gemini_Generated_Image_lhyyv2lhyyv2lhyy_1.png';
    const LS_IDIOMA = localStorage.getItem('zaard_lang') || 'es'; 

    // Configuración Web3 y Apuestas oficiales
    const TOKEN_ADDR = "0x3468EA4e6CE13Ec4C7f8651f7eFC6AA6046F4d65"; 
    const BURN_WALLET = "0x000000000000000000000000000000000000dEaD"; 
    const ABI_TRANSFER = [{"constant":false,"inputs":[{"name":"_to","type":"address"},{"name":"_value","type":"uint256"}],"name":"transfer","outputs":[{"name":"","type":"bool"}],"type":"function"}];
    const APUESTA_WEI = "100000000000000"; // 0.0001 ZARD

    let web3, contract, userAccount, esModoWeb3 = false;
    let nivelActual = 1;
    let musicaHabilitada = localStorage.getItem('zaard_musica') !== 'OFF';
    const avatarImageKey = 'avatarUsr';
    let audioCtx = null;

    // Inicializador de Audio Sólido (Web Audio API para efectos impecables)
    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function reproducirSonido(tipo) {
        try {
            initAudioContext();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (tipo === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (tipo === 'acierto') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (tipo === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.25);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (tipo === 'victoria') {
                osc.type = 'sine';
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    let t = now + idx * 0.12;
                    let o = audioCtx.createOscillator();
                    let g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, t);
                    g.gain.setValueAtTime(0.2, t);
                    g.gain.linearRampToValueAtTime(0.01, t + 0.2);
                    o.start(t);
                    o.stop(t + 0.2);
                });
            }
        } catch(e) {
            console.log("Audio FX error:", e);
        }
    }

    // Traducción rápida del modal de bienvenida
    window.addEventListener('DOMContentLoaded', () => {
        const audio = document.getElementById('zaard-audio');
        audio.volume = 0.3;
        if (musicaHabilitada) {
            audio.play().catch(e => console.log("Autoplay pendiente"));
        }
        document.getElementById('loading-screen').style.display = 'none';

        if (LS_IDIOMA === 'zh') {
            document.getElementById('txt-titulo-modal').innerHTML = "⚡ 潘加协议 ⚡";
            document.getElementById('txt-desc-modal').innerHTML = "欢迎来到宇宙记忆挑战！<br>下注: 0.0001 ZARD<br>奖励: 0.00015 ZARD<br>失败时自动销毁。";
            document.querySelector('.btn-invitado').innerText = "游客模式 🚀";
            document.querySelector('.btn-web3').innerText = "连接 Web3 钱包";
            document.querySelector('.btn-volver').innerText = "⬅ 返回街机菜单";
        } else if (LS_IDIOMA === 'en') {
            document.getElementById('txt-titulo-modal').innerHTML = "⚡ PANGA PROTOCOL ⚡";
            document.getElementById('txt-desc-modal').innerHTML = "Welcome to the Cosmic Memory Challenge!<br>Bet: 0.0001 ZARD<br>Win: 0.00015 ZARD<br>Auto-burn on loss.";
            document.querySelector('.btn-invitado').innerText = "GUEST MODE 🚀";
            document.querySelector('.btn-web3').innerText = "CONNECT WEB3 WALLET";
            document.querySelector('.btn-volver').innerText = "⬅ BACK TO ARCADE MENU";
        }
    });

    function elegirModo(modo) {
        reproducirSonido('click');
        esModoWeb3 = false;
        document.getElementById('modal-bienvenida').style.display = 'none';
        iniciarPhaserGame();
    }

    async function conectarYJugar() {
        reproducirSonido('click');
        if (window.ethereum) {
            try {
                web3 = new Web3(window.ethereum);
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAccount = accounts[0];
                contract = new web3.eth.Contract(ABI_TRANSFER, TOKEN_ADDR);
                esModoWeb3 = true;
                alert(LS_IDIOMA === 'zh' ? "钱包已连接！" : (LS_IDIOMA === 'en' ? "Wallet connected successfully!" : "¡Billetera conectada con éxito!"));
                document.getElementById('modal-bienvenida').style.display = 'none';
                iniciarPhaserGame();
            } catch (e) { 
                alert(LS_IDIOMA === 'zh' ? "连接失败。" : (LS_IDIOMA === 'en' ? "Connection cancelled or failed." : "Conexión cancelada o fallida.")); 
            }
        } else { 
            alert(LS_IDIOMA === 'zh' ? "请安装 Web3 钱包。" : (LS_IDIOMA === 'en' ? "Please install MetaMask or a Web3 wallet." : "Por favor instala MetaMask o una billetera Web3.")); 
        }
    }

    async function ejecutarQuemaPorPerdida() {
        if (esModoWeb3 && contract && userAccount) {
            try {
                const msg = LS_IDIOMA === 'zh' ? "正在处理销毁交易..." : (LS_IDIOMA === 'en' ? "Processing burn transaction..." : "Procesando quema de 0.0001 ZARD...");
                const msgDiv = document.createElement('div');
                msgDiv.style.position = 'fixed'; msgDiv.style.top='50%'; msgDiv.style.left='50%';
                msgDiv.style.transform='translate(-50%, -50%)'; msgDiv.style.background='rgba(0,0,0,0.9)';
                msgDiv.style.color='#ff4444'; msgDiv.style.padding='20px'; msgDiv.style.borderRadius='15px';
                msgDiv.style.zIndex='3000'; msgDiv.style.fontWeight='bold';
                msgDiv.innerText = msg;
                document.body.appendChild(msgDiv);

                await contract.methods.transfer(BURN_WALLET, APUESTA_WEI).send({ from: userAccount });
                msgDiv.remove();
                alert(LS_IDIOMA === 'zh' ? "代币已销毁至 Dead 地址。" : (LS_IDIOMA === 'en' ? "Bet tokens sent to burn wallet." : "Tokens de apuesta enviados a la billetera de quema."));
            } catch (e) { 
                console.log("Error en quema:", e); 
            }
        }
    }

    function irAlMenuArcade() {
        reproducirSonido('click');
        // Redirige al menú principal del arcade / índice general
        window.location.href = "index.html";
    }

    function volverAlModalSeleccion() {
        reproducirSonido('click');
        // Limpia cualquier canvas de Phaser existente si lo hubiera y muestra de nuevo el modal de bienvenida
        const canvasContainer = document.querySelector('canvas');
        if (canvasContainer) {
            canvasContainer.remove();
        }
        nivelActual = 1;
        document.getElementById('modal-bienvenida').style.display = 'flex';
    }

    function manejarVictoriaFinal(sceneRef) {
        reproducirSonido('victoria');
        let mensaje = `🌟 ¡MAGNÍFICO, ${LS_NOMBRE.toUpperCase()}! 🌟\n\n¡Has superado con éxito los 10 niveles del Protocolo Panga y demostrado una memoria cósmica legendaria!`;
        if (LS_IDIOMA === 'en') mensaje = `🌟 MAGNIFICENT, ${LS_NOMBRE.toUpperCase()}! 🌟\n\nYou successfully completed all 10 levels and proved legendary cosmic memory!`;
        if (LS_IDIOMA === 'zh') mensaje = `🌟 太棒了，${LS_NOMBRE.toUpperCase()}！ 🌟\n\n您已成功通过所有 10 个关卡，展现了传奇的宇宙记忆力！`;
        
        alert(mensaje);
        volverAlModalSeleccion();
    }

    async function manejarDerrota(sceneRef) {
        reproducirSonido('error');
        let mensaje = "¡Te has quedado sin oportunidades! Las estrellas se han reconfigurado. Inténtalo de nuevo.";
        if (LS_IDIOMA === 'en') mensaje = "You lost all opportunities! The stars have realigned. Try again.";
        if (LS_IDIOMA === 'zh') mensaje = "您已失去所有机会！星星已重新排列，请再试一次。";

        if (esModoWeb3) {
            await ejecutarQuemaPorPerdida();
        }
        
        alert(mensaje);
        volverAlModalSeleccion(); // Vuelve al menú de selección invitado / web3 para evitar bloqueos
    }

    function iniciarPhaserGame() {
        // Limpiar canvas anterior si existiera
        const existingCanvas = document.querySelector('canvas');
        if (existingCanvas) existingCanvas.remove();

        new Phaser.Game({
            type: Phaser.AUTO, 
            width: window.innerWidth, 
            height: window.innerHeight,
            backgroundColor: '#070112',
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: 480,
                height: 800
            },
            scene: {
                preload: function() {
                    const cids = [
                        'bafybeifzkdoitiowwicqwnkfx6dnahydk5mm33h7r3j3wyv7c4rjp75ws4', 'bafybeiakl2nuugolggppxfttwcxfsv56zsjms4ityd5vjyyd54ctirzaeq', 
                        'bafybeicugqjr3uy2mvk32536qi3gf3astpwj53nlbeogx3vmzsmk2ia3wa', 'bafybeickwp5h3ew6bm4aim6r5v5sc5xha6h3hdsbrhja2zeruosphac5ba', 
                        'bafybeigxro3eht2lctrk4akglifsxuvwolwqfzgqzvnstabnpjjiungza4', 'bafybeidwy5yeihhglhcuztl32loatlk3wccecimodl6m4ocuotuuru7gvi', 
                        'bafybeiheko4izm53qfmhejmvz5elek4hb2lp3weaduwndvrvpxdamwklue', 'bafybeiggz26x26hncisti5s5y74ciuk4yuymtczhsbwdufoql2gidl57mu', 
                        'bafybeiginlvb63afmlicnvsx4fwfekanoipydzgzv3ay7njpvq6nm4zzym', 'bafybeie5wqjyuwdezpoe5tqkqlojxv5evtdkv6mxhondx5hvod44txbobq'
                    ];
                    cids.forEach((c, i) => this.load.image('c'+i, 'https://ipfs.io/ipfs/'+c));
                    this.load.image('dorso', 'https://ipfs.io/ipfs/bafybeibmhheisrjxpxpcsh6goj6c4pxraz5xkcizn4aiyl5eamdc5qyc3m');
                    this.load.image(avatarImageKey, LS_AVATAR_URL);
                },
                create: function() {
                    let sceneRef = this;
                    this.vidas = 12;
                    this.bloqueado = false;
                    this.primeraCarta = null;
                    
                    // Fondo espacial limpio y elegante (estrellas/nebulosa sutil generada por código)
                    let bgGlow = this.add.circle(240, 400, 320, 0x3d106b, 0.35);
                    bgGlow.setBlendMode(Phaser.BlendModes.ADD);

                    // Pequeñas estrellas de fondo para dar atmósfera espacial
                    for(let i=0; i<35; i++) {
                        let sx = Phaser.Math.Between(15, 465);
                        let sy = Phaser.Math.Between(15, 785);
                        let star = this.add.circle(sx, sy, Phaser.Math.FloatBetween(1, 2.2), 0xffffff, Phaser.Math.FloatBetween(0.3, 0.9));
                        this.tweens.add({
                            targets: star,
                            alpha: 0.1,
                            duration: Phaser.Math.Between(1000, 3000),
                            yoyo: true,
                            repeat: -1
                        });
                    }

                    // --- PANEL SUPERIOR DE USUARIO (OPTIMIZADO PARA PC Y MÓVIL) ---
                    let panelBg = this.add.graphics();
                    panelBg.fillStyle(0x180536, 0.9);
                    panelBg.lineStyle(2, 0x00ffff, 0.8);
                    panelBg.fillRoundedRect(20, 15, 440, 80, 16);
                    panelBg.strokeRoundedRect(20, 15, 440, 80, 16);

                    // Avatar del usuario
                    this.avatarImg = this.add.image(65, 55, avatarImageKey).setDisplaySize(60, 60).setOrigin(0.5);
                    let avatarBorder = this.add.graphics();
                    avatarBorder.lineStyle(3, 0xd946ef, 1);
                    avatarBorder.strokeCircle(65, 55, 32);

                    // Nombre y Nivel
                    this.txtNombre = this.add.text(115, 30, LS_NOMBRE, { fontSize: '18px', color: '#00ffff', fontStyle: 'bold' });
                    this.txtNivel = this.add.text(115, 58, (LS_IDIOMA === 'zh' ? "关卡: " : (LS_IDIOMA === 'en' ? "Level: " : "Nivel: ")) + `${nivelActual} / 10`, { fontSize: '15px', color: '#e879f9', fontStyle: 'bold' });
                    
                    // Vidas / Oportunidades
                    this.txtVidas = this.add.text(435, 32, `❤️ ${this.vidas}`, { fontSize: '18px', color: '#f87171', fontStyle: 'bold' }).setOrigin(1, 0);

                    // Botones de acción superior: Volver al menú de selección y Menú Arcade
                    let txtMenuText = LS_IDIOMA === 'zh' ? "菜单" : (LS_IDIOMA === 'en' ? "MENU" : "MENÚ");
                    let btnMenu = this.add.text(435, 62, txtMenuText, { fontSize: '13px', color: '#38bdf8', fontStyle: 'bold' }).setOrigin(1, 0).setInteractive();
                    btnMenu.on('pointerdown', volverAlModalSeleccion);

                    let txtArcadeText = LS_IDIOMA === 'zh' ? "街机" : (LS_IDIOMA === 'en' ? "ARCADE" : "ARCADE");
                    let btnArcade = this.add.text(370, 62, txtArcadeText, { fontSize: '13px', color: '#f43f5e', fontStyle: 'bold' }).setOrigin(1, 0).setInteractive();
                    btnArcade.on('pointerdown', irAlMenuArcade);

                    function construirTablero() {
                        if (sceneRef.cartasGroup) {
                            sceneRef.cartasGroup.destroy(true);
                        }
                        sceneRef.cartasGroup = sceneRef.add.group();

                        let totalPares = Math.min(4 + nivelActual, 10);
                        let deck = []; 
                        for(let i = 0; i < totalPares; i++) { deck.push(i, i); }
                        Phaser.Utils.Array.Shuffle(deck);
                        
                        let cols = 4;
                        let cardSize = 78; 
                        let spacingX = 90;
                        let spacingY = 90;
                        
                        let startX = 240 - (((cols - 1) * spacingX) / 2);
                        let startY = 210; 
                        
                        deck.forEach((val, idx) => {
                            let r = Math.floor(idx / cols);
                            let c = idx % cols;
                            let posX = startX + c * spacingX;
                            let posY = startY + r * spacingY;
                            
                            let carta = sceneRef.add.sprite(posX, posY, 'dorso').setDisplaySize(cardSize, cardSize).setInteractive();
                            carta.val = val;
                            carta.revelada = false;
                            sceneRef.cartasGroup.add(carta);
                            
                            carta.on('pointerdown', () => {
                                if (sceneRef.bloqueado || carta.revelada || carta === sceneRef.primeraCarta) return;
                                reproducirSonido('click');
                                carta.setTexture('c' + carta.val);
                                
                                if (!sceneRef.primeraCarta) {
                                    sceneRef.primeraCarta = carta;
                                } else {
                                    sceneRef.bloqueado = true;
                                    let primera = sceneRef.primeraCarta;
                                    sceneRef.primeraCarta = null;
                                    
                                    if (primera.val === carta.val) {
                                        reproducirSonido('acierto');
                                        primera.revelada = true;
                                        carta.revelada = true;
                                        sceneRef.bloqueado = false;
                                        
                                        let todasResueltas = true;
                                        sceneRef.cartasGroup.children.iterate((item) => {
                                            if (item && !item.revelada) todasResueltas = false;
                                        });
                                        
                                        if (todasResueltas) {
                                            if (nivelActual >= 10) {
                                                manejarVictoriaFinal(sceneRef);
                                            } else {
                                                nivelActual++;
                                                sceneRef.time.delayedCall(800, () => {
                                                    sceneRef.txtNivel.setText((LS_IDIOMA === 'zh' ? "关卡: " : (LS_IDIOMA === 'en' ? "Level: " : "Nivel: ")) + `${nivelActual} / 10`);
                                                    construirTablero();
                                                });
                                            }
                                        }
                                    } else {
                                        reproducirSonido('error');
                                        sceneRef.vidas--;
                                        sceneRef.txtVidas.setText(`❤️ ${sceneRef.vidas}`);
                                        
                                        sceneRef.time.delayedCall(800, () => {
                                            primera.setTexture('dorso');
                                            carta.setTexture('dorso');
                                            sceneRef.bloqueado = false;
                                            
                                            if (sceneRef.vidas <= 0) {
                                                manejarDerrota(sceneRef);
                                            }
                                        });
                                    }
                                }
                            });
                        });
                    }

                    construirTablero();
                }
            }
        });
    }
</script>

</body>
</html>
