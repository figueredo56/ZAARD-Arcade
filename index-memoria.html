<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ZAARD MEMORY ARCADE - Protocolo Panga</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: linear-gradient(135deg, #1e0033 0%, #0d001a 50%, #001f3f 100%);
            background-attachment: fixed;
            overflow: hidden; 
            font-family: 'Arial', sans-serif; 
            color: #fff;
        }
        #ui-container { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 1000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: rgba(10, 0, 25, 0.85); 
            backdrop-filter: blur(12px);
        }
        @keyframes triColorGlow {
            0% { border-color: #00ffff; box-shadow: 0 0 35px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.2); }
            33% { border-color: #22c55e; box-shadow: 0 0 40px rgba(34, 197, 94, 0.6), inset 0 0 20px rgba(34, 197, 94, 0.2); }
            66% { border-color: #a855f7; box-shadow: 0 0 45px rgba(168, 85, 247, 0.7), inset 0 0 25px rgba(168, 85, 247, 0.3); }
            100% { border-color: #00ffff; box-shadow: 0 0 35px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.2); }
        }
        .ui-panel { 
            width: 94%; 
            max-width: 700px; 
            background: linear-gradient(135deg, rgba(25, 10, 45, 0.98) 0%, rgba(10, 5, 20, 0.98) 100%); 
            border: 3px solid #a855f7; 
            border-radius: 35px; 
            padding: 35px; 
            text-align: center; 
            animation: triColorGlow 5s infinite ease-in-out;
            box-sizing: border-box;
            max-height: 92vh;
            overflow-y: auto;
        }
        .banner { 
            width: 100%; 
            height: 220px; 
            background-size: cover; 
            background-position: center; 
            border-radius: 20px; 
            margin-bottom: 25px; 
            border: 2px solid #00ffff; 
            box-shadow: 0 0 20px rgba(0,255,255,0.4);
        }
        .btn-zaard { 
            width: 100%; 
            padding: 22px; 
            margin-top: 18px; 
            border: 2px solid #00ffff; 
            border-radius: 22px; 
            background: linear-gradient(135deg, #a855f7, #22c55e); 
            color: white; 
            font-weight: bold; 
            font-size: 20px; 
            cursor: pointer; 
            text-transform: uppercase; 
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-zaard:hover { transform: scale(1.03); box-shadow: 0 0 25px rgba(0,255,255,0.7); }
        h1 { font-size: 3em; margin: 0 0 10px 0; background: linear-gradient(135deg, #00ffff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 25px rgba(168, 85, 247, 0.6); }
        h2 { color: #bc8fef; font-size: 2.2em; margin-top: 0; text-shadow: 0 0 10px rgba(188,143,239,0.5); }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid rgba(168, 85, 247, 0.4); padding-bottom: 12px; }
        .close-btn { background: #5a2d82; color: #fff; border: 2px solid #00ffff; width: 40px; height: 40px; border-radius: 50%; font-weight: bold; cursor: pointer; font-size: 20px; box-shadow: 0 0 10px rgba(0,255,255,0.4); }
        .setting-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.06); padding: 15px 20px; border-radius: 18px; margin-bottom: 12px; border: 1px solid rgba(0,255,255,0.2); font-size: 18px; }
        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
        .avatar-item { background: rgba(0,0,0,0.6); border: 3px solid #a855f7; border-radius: 18px; padding: 10px; cursor: pointer; text-align: center; transition: 0.2s; }
        .avatar-item.selected { border-color: #22c55e; box-shadow: 0 0 20px rgba(34,197,94,0.7); transform: scale(1.05); }
        .avatar-item img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; }
        select { background: #1e0033; color: #fff; border: 2px solid #00ffff; padding: 10px 18px; border-radius: 12px; font-weight: bold; font-size: 16px; outline: none; }
    </style>
</head>
<body>

<!-- Reproductor de audio global -->
<div style="position: fixed; bottom: 12px; right: 12px; z-index: 2000; background: rgba(10,5,25,0.9); padding: 8px 15px; border-radius: 18px; border: 2px solid #00ffff; box-shadow: 0 0 15px rgba(0,255,255,0.4);">
    <span style="font-size: 11px; color: #00ffff; font-weight: bold;">🎶 El Chupulún de Zaard</span>
    <audio id="zaard-audio" controls autoplay loop style="height: 28px; width: 140px; vertical-align: middle; margin-left: 5px;">
        <source src="El Chupulún de Zaard.mp3" type="audio/mpeg">
    </audio>
</div>

<div id="ui-container">
    <!-- Pantalla 1: Inicio Protocolo -->
    <div id="pantalla-inicio" class="ui-panel">
        <div class="banner" style="background-image: url('https://ipfs.io/ipfs/bafybeiefhnawny7nlgixveiia7aaougqxsird6or4nws52vp36ndbfvixa')"></div>
        <h1>ZAARD ARCADE</h1>
        <p style="color: #00ffff; font-size: 18px; margin-bottom: 25px; font-weight: bold;">Elige tu Avatar y supera el desafío de 10 Niveles</p>
        
        <div style="margin-bottom: 20px;">
            <p style="color: #bc8fef; font-size: 16px; margin-bottom: 10px;">Selecciona tu Avatar Inicial:</p>
            <div class="avatar-grid" style="max-width: 400px; margin: 0 auto;">
                <div class="avatar-item selected" onclick="seleccionarAvatarInicio(0, this)"><img src="https://ipfs.io/ipfs/bafybeicugqjr3uy2mvk32536qi3gf3astpwj53nlbeogx3vmzsmk2ia3wa"></div>
                <div class="avatar-item" onclick="seleccionarAvatarInicio(1, this)"><img src="https://ipfs.io/ipfs/bafybeickwp5h3ew6bm4aim6r5v5sc5xha6h3hdsbrhja2zeruosphac5ba"></div>
                <div class="avatar-item" onclick="seleccionarAvatarInicio(2, this)"><img src="https://ipfs.io/ipfs/bafybeigxro3eht2lctrk4akglifsxuvwolwqfzgqzvnstabnpjjiungza4"></div>
                <div class="avatar-item" onclick="seleccionarAvatarInicio(3, this)"><img src="https://ipfs.io/ipfs/bafybeidwy5yeihhglhcuztl32loatlk3wccecimodl6m4ocuotuuru7gvi"></div>
            </div>
            <input type="text" id="input-nombre-inicio" placeholder="Tu Alias / Nombre" value="Panga" style="width: 80%; padding: 14px; border-radius: 14px; border: 2px solid #00ffff; background: #0d001a; color: #fff; text-align: center; font-size: 18px; margin-top: 15px; outline: none;">
        </div>

        <button class="btn-zaard" onclick="iniciarConAvatarYContinuar()">¡ENTRAR AL JUEGO! 🚀</button>
    </div>

    <!-- Pantalla 2: Menú Principal / Selección -->
    <div id="menu-seleccion" class="ui-panel" style="display:none;">
        <div class="banner" style="background-image: url('https://ipfs.io/ipfs/bafybeic5377igwloc2o63whivoykazkibjruq7bau4edjpfdfu4gudunjm')"></div>
        <h2>MEMORY RUN - 10 NIVELES</h2>
        <div id="user-info-box" style="margin-bottom: 20px; font-size: 18px; color: #00ffff; font-weight: bold;"></div>
        
        <button class="btn-zaard" onclick="lanzarJuego(false)">MODO INVITADO</button>
        <button class="btn-zaard" onclick="conectarYJugar()" style="background: linear-gradient(135deg, #00ffff, #3b0764);">CONECTAR BILLETERA WEB3</button>
        <button class="btn-zaard" onclick="abrirPerfil()" style="background: rgba(168,85,247,0.4); border: 2px solid #a855f7;">🎨 Cambiar Avatar y Perfil</button>
        <button class="btn-zaard" onclick="abrirAjustes()" style="background: rgba(0,255,255,0.3); border: 2px solid #00ffff;">⚙️ Ajustes (Idioma y Sonido)</button>
    </div>

    <!-- Pantalla de Perfil / Avatares -->
    <div id="modal-perfil" class="ui-panel" style="display:none;">
        <div class="modal-header">
            <h2>Personalizar Perfil</h2>
            <button class="close-btn" onclick="cerrarModal('modal-perfil')">X</button>
        </div>
        <p style="color: #00ffff; font-size: 16px;">Elige tu Avatar de Alta Calidad:</p>
        <div class="avatar-grid">
            <div class="avatar-item selected" onclick="seleccionarAvatar(0, this)"><img src="https://ipfs.io/ipfs/bafybeicugqjr3uy2mvk32536qi3gf3astpwj53nlbeogx3vmzsmk2ia3wa"></div>
            <div class="avatar-item" onclick="seleccionarAvatar(1, this)"><img src="https://ipfs.io/ipfs/bafybeickwp5h3ew6bm4aim6r5v5sc5xha6h3hdsbrhja2zeruosphac5ba"></div>
            <div class="avatar-item" onclick="seleccionarAvatar(2, this)"><img src="https://ipfs.io/ipfs/bafybeigxro3eht2lctrk4akglifsxuvwolwqfzgqzvnstabnpjjiungza4"></div>
            <div class="avatar-item" onclick="seleccionarAvatar(3, this)"><img src="https://ipfs.io/ipfs/bafybeidwy5yeihhglhcuztl32loatlk3wccecimodl6m4ocuotuuru7gvi"></div>
        </div>
        <div style="margin-top: 20px;">
            <input type="text" id="input-nombre" placeholder="Tu Nombre o Alias" value="Panga" style="width: 80%; padding: 14px; border-radius: 12px; border: 2px solid #00ffff; background: #0d001a; color: #fff; text-align: center; font-size: 18px; outline: none;">
        </div>
        <button class="btn-zaard" onclick="guardarPerfil()" style="margin-top: 25px;">Guardar Perfil</button>
    </div>

    <!-- Pantalla de Ajustes -->
    <div id="modal-ajustes" class="ui-panel" style="display:none;">
        <div class="modal-header">
            <h2>Ajustes del Sistema</h2>
            <button class="close-btn" onclick="cerrarModal('modal-ajustes')">X</button>
        </div>
        <div class="setting-row">
            <span>🎵 Música de Fondo</span>
            <select id="sel-musica" onchange="toggleMusica(this.value)">
                <option value="ON">ON</option>
                <option value="OFF">OFF</option>
            </select>
        </div>
        <div class="setting-row">
            <span>🔊 Efectos de Sonido</span>
            <select id="sel-sfx" onchange="toggleSfx(this.value)">
                <option value="ON">ON</option>
                <option value="OFF">OFF</option>
            </select>
        </div>
        <div class="setting-row">
            <span>🌐 Idioma</span>
            <select id="sel-lang" onchange="cambiarIdioma(this.value)">
                <option value="es">Español</option>
                <option value="en">English</option>
            </select>
        </div>
        <button class="btn-zaard" onclick="cerrarModal('modal-ajustes')" style="margin-top: 20px;">Aceptar</button>
    </div>
</div>

<script>
    const TOKEN_ADDR = "0x3468EA4e6CE13Ec4C7f8651f7eFC6AA6046F4d65";
    const POOL_LP_ADDR = "0x7084D8562532AEA9F9239Cdd63EA289C85E6b0e9";
    const ABI = [{"constant":false,"inputs":[{"name":"_to","type":"address"},{"name":"_value","type":"uint256"}],"name":"transfer","outputs":[{"name":"","type":"bool"}],"type":"function"}];
    
    let web3, contract, userAccount, esWeb3 = false;
    let nivelActual = 1;
    let sfxHabilitado = true;
    let avatarSeleccionado = 0;
    let nombreUsuario = "Panga";
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const avatarUrls = [
        'https://ipfs.io/ipfs/bafybeicugqjr3uy2mvk32536qi3gf3astpwj53nlbeogx3vmzsmk2ia3wa',
        'https://ipfs.io/ipfs/bafybeickwp5h3ew6bm4aim6r5v5sc5xha6h3hdsbrhja2zeruosphac5ba',
        'https://ipfs.io/ipfs/bafybeigxro3eht2lctrk4akglifsxuvwolwqfzgqzvnstabnpjjiungza4',
        'https://ipfs.io/ipfs/bafybeidwy5yeihhglhcuztl32loatlk3wccecimodl6m4ocuotuuru7gvi'
    ];

    window.addEventListener('DOMContentLoaded', () => {
        const audio = document.getElementById('zaard-audio');
        audio.volume = 0.3;
        audio.play().catch(e => console.log("Autoplay pendiente"));
    });

    function playSnd(freq, dur, type = 'sine') {
        if (!sfxHabilitado) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let o = audioCtx.createOscillator();
        let g = audioCtx.createGain();
        o.type = type; 
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); 
        g.connect(audioCtx.destination);
        o.start(); 
        o.stop(audioCtx.currentTime + dur);
    }

    function seleccionarAvatarInicio(idx, el) {
        document.querySelectorAll('#pantalla-inicio .avatar-item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
        avatarSeleccionado = idx;
    }

    function iniciarConAvatarYContinuar() {
        nombreUsuario = document.getElementById('input-nombre-inicio').value || "Panga";
        document.getElementById('pantalla-inicio').style.display = 'none';
        document.getElementById('menu-seleccion').style.display = 'block';
        document.getElementById('user-info-box').innerHTML = `👤 Jugador: ${nombreUsuario} | Nivel Actual: ${nivelActual}/10`;
    }

    function abrirPerfil() { document.getElementById('modal-perfil').style.display = 'block'; }
    function abrirAjustes() { document.getElementById('modal-ajustes').style.display = 'block'; }
    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }

    function seleccionarAvatar(idx, el) {
        document.querySelectorAll('#modal-perfil .avatar-item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
        avatarSeleccionado = idx;
    }

    function guardarPerfil() {
        nombreUsuario = document.getElementById('input-nombre').value || "Panga";
        document.getElementById('user-info-box').innerHTML = `👤 Jugador: ${nombreUsuario} | Nivel Actual: ${nivelActual}/10`;
        cerrarModal('modal-perfil');
    }

    function toggleSfx(val) { sfxHabilitado = (val === 'ON'); }
    function toggleMusica(val) {
        const audio = document.getElementById('zaard-audio');
        if(val === 'OFF') audio.pause(); else audio.play();
    }
    function cambiarIdioma(lang) { console.log("Idioma:", lang); }

    async function conectarYJugar() {
        if (window.ethereum) {
            try {
                web3 = new Web3(window.ethereum);
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAccount = accounts[0];
                contract = new web3.eth.Contract(ABI, TOKEN_ADDR);
                esWeb3 = true;
                lanzarJuego(true);
            } catch (e) { alert("Conexión de billetera fallida."); }
        } else { alert("Instala MetaMask o una billetera Web3 compatible."); }
    }

    async function ejecutarPerdida() {
        if (esWeb3 && contract) {
            try {
                await contract.methods.transfer(POOL_LP_ADDR, "100000000000000").send({ from: userAccount });
            } catch (e) { console.log("Transferencia omitida"); }
        }
        alert("¡Te has quedado sin oportunidades! Reiniciando desafío en Nivel 1.");
        nivelActual = 1;
        location.reload();
    }

    function lanzarJuego(esModoWeb3) {
        document.getElementById('ui-container').remove(); 
        
        new Phaser.Game({
            type: Phaser.AUTO, 
            width: window.innerWidth, 
            height: window.innerHeight,
            backgroundColor: '#0d001a',
            scene: {
                preload: function() {
                    const cids = [
                        'bafybeifzkdoitiowwicqwnkfx6dnahydk5mm33h7r3j3wyv7c4rjp75ws4', 
                        'bafybeiakl2nuugolggppxfttwcxfsv56zsjms4ityd5vjyyd54ctirzaeq', 
                        'bafybeicugqjr3uy2mvk32536qi3gf3astpwj53nlbeogx3vmzsmk2ia3wa', 
                        'bafybeickwp5h3ew6bm4aim6r5v5sc5xha6h3hdsbrhja2zeruosphac5ba', 
                        'bafybeigxro3eht2lctrk4akglifsxuvwolwqfzgqzvnstabnpjjiungza4', 
                        'bafybeidwy5yeihhglhcuztl32loatlk3wccecimodl6m4ocuotuuru7gvi', 
                        'bafybeiheko4izm53qfmhejmvz5elek4hb2lp3weaduwndvrvpxdamwklue', 
                        'bafybeiggz26x26hncisti5s5y74ciuk4yuymtczhsbwdufoql2gidl57mu', 
                        'bafybeiginlvb63afmlicnvsx4fwfekanoipydzgzv3ay7njpvq6nm4zzym', 
                        'bafybeie5wqjyuwdezpoe5tqkqlojxv5evtdkv6mxhondx5hvod44txbobq',
                        'bafybeibmhheisrjxpxpcsh6goj6c4pxraz5xkcizn4aiyl5eamdc5qyc3m', 
                        'bafybeieiiuojv6snmh2vchhigyoq7s5vcdvel66ih5tacnhp6ceaveg3um', 
                        'bafybeibpwlfqcnmrz67trsxsdaxq5xmdwrywvgbstgg7hvtshqggkjwd74', 
                        'bafybeif2pjebwhe3eodqoxhu3rccaxt6frh2mb5lxro2gy6p5syacgtaly', 
                        'bafybeif5pqgoxonxnxscoayvpzawsxzw5lm6upxkbslnkbgjeenf5cg24m', 
                        'bafybeihqftstfjm3i32e3xm54xo52h6tpldlmfkwc2z6tx5qthbonyboue'
                    ];
                    cids.forEach((c, i) => this.load.image('c'+i, 'https://ipfs.io/ipfs/'+c));
                    this.load.image('dorso', 'https://ipfs.io/ipfs/bafybeibmhheisrjxpxpcsh6goj6c4pxraz5xkcizn4aiyl5eamdc5qyc3m');
                    this.load.image('avatarUsr', avatarUrls[avatarSeleccionado]);
                },
                create: function() {
                    this.vidas = 12;
                    
                    // Avatar y barra superior en pantalla de juego
                    this.add.image(60, 55, 'avatarUsr').setDisplaySize(55, 55);
                    this.add.text(105, 35, `${nombreUsuario}`, { fontSize: '22px', color: '#00ffff', fontStyle: 'bold' });
                    this.add.text(105, 65, `Nivel: ${nivelActual} / 10`, { fontSize: '18px', color: '#a855f7', fontStyle: 'bold' });
                    this.txtVidas = this.add.text(window.innerWidth - 240, 45, `Oportunidades: ${this.vidas}`, { fontSize: '20px', color: '#bc8fef' });
                    
                    // RETO PROGRESIVO: Desde 10 cartas (5 pares) en Nivel 1 hasta 20 cartas (10 pares) en Nivel 10
                    let totalPares = 4 + nivelActual; // Nivel 1 = 5 pares (10 cartas), Nivel 10 = 14 pares (28 cartas)
                    if(totalPares > 10) totalPares = 10; // Máximo 10 parejas únicas disponibles en el array de imágenes
                    
                    let deck = []; 
                    for(let i=0; i<totalPares; i++) { deck.push(i, i); }
                    Phaser.Utils.Array.Shuffle(deck);
                    
                    let cols = 5;
                    let startX = (window.innerWidth / 2) - ((cols * 110) / 2) + 50;
                    let startY = 180;

                    this.paresRestantes = totalPares;
                    let sceneRef = this;

                    deck.forEach((id, i) => {
                        let x = startX + (i % cols) * 115;
                        let y = startY + Math.floor(i / cols) * 115;
                        let card = this.add.sprite(x, y, 'dorso').setScale(0.18).setInteractive();
                        card.cid = 'c'+id;
                        
                        card.on('pointerdown', () => {
                            playSnd(500, 0.1, 'triangle');
                            if(sceneRef.lock || card.texture.key !== 'dorso') return;
                            card.setTexture(card.cid);
                            
                            if(!sceneRef.p1) {
                                sceneRef.p1 = card;
                            } else {
                                sceneRef.lock = true;
                                if(sceneRef.p1.cid !== card.cid) {
                                    setTimeout(() => {
                                        sceneRef.p1.setTexture('dorso'); 
                                        card.setTexture('dorso');
                                        sceneRef.p1 = null; 
                                        sceneRef.lock = false;
                                        sceneRef.vidas--; 
                                        sceneRef.txtVidas.setText('Oportunidades: ' + sceneRef.vidas);
                                        if(sceneRef.vidas <= 0) ejecutarPerdida();
                                    }, 750);
                                } else { 
                                    playSnd(850, 0.2, 'sine');
                                    sceneRef.p1 = null; 
                                    sceneRef.lock = false;
                                    sceneRef.paresRestantes--;
                                    
                                    // Al completar todas las parejas del nivel actual
                                    if(sceneRef.paresRestantes === 0) {
                                        setTimeout(() => {
                                            if(nivelActual < 10) {
                                                mostrarModalVictoria(sceneRef);
                                            } else {
                                                alert("¡IMPRESIONANTE! ¡Has completado los 10 niveles del Protocolo Panga con éxito absoluto!");
                                                location.reload();
                                            }
                                        }, 400);
                                    }
                                }
                            }
                        });
                    });
                }
            }
        });
    }

    function mostrarModalVictoria(scene) {
        let modalDiv = document.createElement('div');
        modalDiv.style.cssText = "position:fixed; top:0; left:0; width:100vw; height:100vw; background:rgba(10,0,25,0.9); z-index:3000; display:flex; justify-content:center; align-items:center; backdrop-filter:blur(10px);";
        
        modalDiv.innerHTML = `
            <div style="background: linear-gradient(135deg, #1e0033, #0d001a); border: 3px solid #00ffff; border-radius: 30px; padding: 40px; text-align: center; width: 90%; max-width: 450px; box-shadow: 0 0 50px rgba(0,255,255,0.6);">
                <h2 style="color: #00ffff; font-size: 2.5em; margin-bottom: 10px;">¡Felicitaciones! 🎉</h2>
                <p style="color: #bc8fef; font-size: 18px; margin-bottom: 25px;">¡Has superado el Nivel ${nivelActual} con gran inteligencia estratégica!</p>
                <button id="btn-siguiente-nivel" style="width: 100%; padding: 20px; border: none; border-radius: 18px; background: linear-gradient(135deg, #22c55e, #00ffff); color: #000; font-weight: bold; font-size: 20px; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 20px rgba(34,197,94,0.7);">Aceptar y Pasar al Siguiente Nivel ⚡</button>
            </div>
        `;
        document.body.appendChild(modalDiv);

        document.getElementById('btn-siguiente-nivel').onclick = () => {
            modalDiv.remove();
            nivelActual++;
            scene.scene.restart();
        };
    }
</script>
</body>
</html>
