<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAARD Innovation - Cyber Mystery Boxes</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #b000ff;
            --bg-color: #05050a;
            --card-bg: rgba(18, 18, 35, 0.85);
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(176, 0, 255, 0.08) 0%, transparent 40%);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--neon-blue);
            padding: 5px 10px;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 20px;
            max-width: 700px;
        }

        .logo-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 20px var(--neon-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            overflow: hidden;
        }

        h1 {
            font-size: 28px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            margin-bottom: 10px;
        }

        p {
            color: #b8b8d0;
            font-size: 15px;
        }

        @keyframes pulseGlow {
            0% { border-color: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue), inset 0 0 10px rgba(0, 243, 255, 0.2); }
            50% { border-color: var(--neon-purple); box-shadow: 0 0 25px var(--neon-purple), inset 0 0 20px rgba(176, 0, 255, 0.4); }
            100% { border-color: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue), inset 0 0 10px rgba(0, 243, 255, 0.2); }
        }

        #btnWallet {
            background: linear-gradient(135deg, rgba(0,243,255,0.1), rgba(176,0,255,0.1));
            color: var(--text-color);
            border: 2px solid var(--neon-blue);
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 25px;
            animation: pulseGlow 3s infinite ease-in-out;
            transition: transform 0.2s ease;
        }

        #btnWallet:hover { transform: scale(1.05); }

        .info-panel {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
            border: 1px solid rgba(0, 243, 255, 0.3);
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            word-break: break-all;
            font-size: 13px;
        }

        .grid-cajas {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
            width: 100%;
        }

        .caja {
            background-color: var(--card-bg);
            backdrop-filter: blur(5px);
            border: 2px solid var(--neon-blue);
            border-radius: 15px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .caja img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 13px;
            transition: transform 0.3s ease;
        }

        .caja:hover:not(.abierta) {
            border-color: var(--neon-purple);
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 0 20px var(--neon-purple);
        }

        .caja:hover img {
            transform: scale(1.1);
        }

        .caja.abierta { 
            cursor: default; 
            border-color: var(--neon-blue);
            background: rgba(0, 243, 255, 0.1);
        }

        .caja span.numero-caja {
            position: absolute;
            bottom: 5px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
        }

        #mensaje {
            margin-top: 25px;
            font-size: 17px;
            font-weight: 500;
            text-align: center;
            min-height: 50px;
            max-width: 500px;
            padding-bottom: 40px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        @media (max-width: 600px) {
            .grid-cajas { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <select class="language-selector" id="langSelect" onchange="cambiarIdioma()">
        <option value="es">🇪🇸 Español</option>
        <option value="en">🇬🇧 English</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="zh">🇨🇳 中文</option>
    </select>

    <header>
        <div class="logo-container"><span>💎</span></div>
        <h1 id="txtTitle">ZAARD Cyber Vault</h1>
        <p id="txtSubtitle">Participa con <strong>0.0001 BNB</strong>, abre tu caja misteriosa y ayuda a fondear el ecosistema para activar los premios ZARD.</p>
    </header>

    <button id="btnWallet" onclick="gestionarConexion()">Conectar Wallet</button>

    <div class="info-panel">
        <p id="walletStatus">Wallet: Desconectada</p>
        <p><strong>Cartera Creadora (Fondo):</strong> <small>0x84f529525fae84b1f1d7ea66939592094426cdc8</small></p>
    </div>

    <div class="grid-cajas" id="gridCajas"></div>

    <div id="mensaje">Conecta tu billetera para iniciar la secuencia cibernética.</div>

    <script>
        let provider, signer, userAddress;
        let conectado = false;
        
        const CARTERA_CREADORA = "0x84f529525fae84b1f1d7ea66939592094426cdc8";
        const APUESTA_BNB = ethers.utils.parseEther("0.0001"); // Actualizado a 0.0001 BNB

        // Array con los CIDs de IPFS provistos para las cajas
        const ipfsCIDs = [
            "bafybeifzkdoitiowwicqwnkfx6dnahydk5mm33h7r3j3wyv7c4rjp75ws4",
            "bafybeiakl2nuugolggppxfttwcxfsv56zsjms4ityd5vjyyd54ctirzaeq",
            "bafybeicugqjr3uy2mvk32536qi3gf3astpwj53nlbeogx3vmzsmk2ia3wa",
            "bafybeickwp5h3ew6bm4aim6r5v5sc5xha6h3hdsbrhja2zeruosphac5ba",
            "bafybeigxro3eht2lctrk4akglifsxuvwolwqfzgqzvnstabnpjjiungza4",
            "bafybeidwy5yeihhglhcuztl32loatlk3wccecimodl6m4ocuotuuru7gvi",
            "bafybeiheko4izm53qfmhejmvz5elek4hb2lp3weaduwndvrvpxdamwklue",
            "bafybeiggz26x26hncisti5s5y74ciuk4yuymtczhsbwdufoql2gidl57mu",
            "bafybeiginlvb63afmlicnvsx4fwfekanoipydzgzv3ay7njpvq6nm4zzym"
        ];

        const traducciones = {
            es: {
                title: "ZAARD Cyber Vault",
                subtitle: "Participa con 0.0001 BNB, abre tu caja misteriosa y ayuda a fondear el ecosistema para activar los premios ZARD.",
                connect: "Conectar Wallet",
                disconnect: "Desconectar Wallet",
                statusDisc: "Wallet: Desconectada",
                statusConn: "Conectado",
                msgInit: "Conecta tu billetera para iniciar la secuencia cibernética.",
                msgReady: "⚡ ¡Elige una caja! Aporte de 0.0001 BNB para el fondo del ecosistema.",
                msgSuspenso: "🔮 Sincronizando datos cuánticos...",
                msgWaitBNB: "⏳ Autoriza el aporte de 0.0001 BNB en tu wallet...",
                scanned: "🔍 Caja escaneada con éxito. ¡Gracias por aportar al fondo de ZAARD Innovation!",
                retry: "🔄 Abrir otra caja"
            },
            en: {
                title: "ZAARD Cyber Vault",
                subtitle: "Participate with 0.0001 BNB, open your mystery box and help fund the ecosystem for ZARD rewards.",
                connect: "Connect Wallet",
                disconnect: "Disconnect Wallet",
                statusDisc: "Wallet: Disconnected",
                statusConn: "Connected",
                msgInit: "Connect your wallet to start the cyber sequence.",
                msgReady: "⚡ Choose a box! 0.0001 BNB ecosystem contribution.",
                msgSuspenso: "🔮 Synchronizing quantum data...",
                msgWaitBNB: "⏳ Authorize 0.0001 BNB contribution in your wallet...",
                scanned: "🔍 Box successfully scanned. Thank you for funding ZAARD Innovation!",
                retry: "🔄 Open another box"
            },
            ar: {
                title: "ZAARD Cyber Vault",
                subtitle: "شارك بـ 0.0001 BNB وافتح صندوقك الغامض للمساعدة في تمويل النظام البيئي.",
                connect: "ربط المحفظة",
                disconnect: "قطع الاتصال",
                statusDisc: "المحفظة: غير متصلة",
                statusConn: "متصل",
                msgInit: "قم بربط محفظتك لبدء التسلسل السيبراني.",
                msgReady: "⚡ اختر صندوقاً! مساهمة 0.0001 BNB لدعم النظام البيئي.",
                msgSuspenso: "🔮 جاري مزامنة البيانات...",
                msgWaitBNB: "⏳ يرجى تأكيد المساهمة في محفظتك...",
                scanned: "🔍 تم فحص الصندوق بنجاح. شكراً لدعمك!",
                retry: "🔄 فتح صندوق آخر"
            },
            zh: {
                title: "ZAARD Cyber Vault",
                subtitle: "参与 0.0001 BNB，打开你的神秘宝箱并协助资助生态系统以激活 ZARD 奖励。",
                connect: "连接钱包",
                disconnect: "断开连接",
                statusDisc: "钱包：未连接",
                statusConn: "已连接",
                msgInit: "连接您的钱包以启动网络序列。",
                msgReady: "⚡ 选择一个宝箱！0.0001 BNB 生态系统支持贡献。",
                msgSuspenso: "🔮 正在同步量子数据...",
                msgWaitBNB: "⏳ 请在钱包中确认贡献...",
                scanned: "🔍 宝箱扫描成功。感谢您资助 ZAARD Innovation！",
                retry: "🔄 打开另一个宝箱"
            }
        };

        function cambiarIdioma() {
            const lang = document.getElementById("langSelect").value;
            const t = traducciones[lang];
            document.getElementById("txtTitle").innerText = t.title;
            document.getElementById("txtSubtitle").innerHTML = t.subtitle;
            const btn = document.getElementById("btnWallet");
            if (!conectado) {
                btn.innerText = t.connect;
                document.getElementById("walletStatus").innerText = t.statusDisc;
                document.getElementById("mensaje").innerText = t.msgInit;
            } else {
                btn.innerText = t.disconnect;
            }
        }

        async function gestionarConexion() {
            if (!conectado) { await conectarWallet(); } else { desconectarWallet(); }
        }

        async function conectarWallet() {
            const targetProvider = window.ethereum || window.BinanceChain;
            const lang = document.getElementById("langSelect").value;
            const t = traducciones[lang];

            if (targetProvider) {
                try {
                    provider = new ethers.providers.Web3Provider(targetProvider, "any");
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    userAddress = await signer.getAddress();
                    
                    try {
                        document.getElementById("mensaje").innerText = "Firma el protocolo de seguridad...";
                        await signer.signMessage("ZAARD Cyber Protocol - Autenticación Web3.");
                    } catch (e) {}

                    conectado = true;
                    document.getElementById("walletStatus").innerText = `${t.statusConn}: ${userAddress.substring(0,6)}...${userAddress.substring(38)}`;
                    document.getElementById("btnWallet").innerText = t.disconnect;
                    inicializarJuego();
                } catch (error) {
                    console.error(error);
                    alert("Error al conectar la wallet.");
                }
            } else {
                alert("Abre este enlace desde el navegador DApp de Binance App.");
            }
        }

        function desconectarWallet() {
            provider = null; signer = null; userAddress = null; conectado = false;
            const lang = document.getElementById("langSelect").value;
            const t = traducciones[lang];
            document.getElementById("walletStatus").innerText = t.statusDisc;
            document.getElementById("btnWallet").innerText = t.connect;
            document.getElementById("gridCajas").innerHTML = "";
            document.getElementById("mensaje").innerText = t.msgInit;
        }

        function inicializarJuego() {
            const lang = document.getElementById("langSelect").value;
            const t = traducciones[lang];
            const grid = document.getElementById("gridCajas");
            grid.innerHTML = "";

            // Generamos 12 cajas usando de forma cíclica los CIDs de IPFS provistos
            for (let i = 1; i <= 12; i++) {
                const cidIndex = (i - 1) % ipfsCIDs.length;
                const ipfsUrl = `https://gateway.pinata.cloud/ipfs/${ipfsCIDs[cidIndex]}`;

                const caja = document.createElement("div");
                caja.className = "caja";
                caja.innerHTML = `
                    <img src="${ipfsUrl}" alt="Cyber Box ${i}" loading="lazy">
                    <span class="numero-caja">#${i}</span>
                `;
                caja.onclick = () => seleccionarCaja(i, caja, ipfsUrl);
                grid.appendChild(caja);
            }
            document.getElementById("mensaje").innerText = t.msgReady;
        }

        async function seleccionarCaja(numeroCaja, elementoCaja, imgUrl) {
            if (!signer || !conectado) return;

            const lang = document.getElementById("langSelect").value;
            const t = traducciones[lang];
            const mensajeEl = document.getElementById("mensaje");

            const todasLasCajas = document.querySelectorAll(".caja");
            todasLasCajas.forEach(c => c.style.pointerEvents = "none");

            try {
                mensajeEl.innerText = t.msgSuspenso;
                await new Promise(r => setTimeout(r, 900));

                mensajeEl.innerText = t.msgWaitBNB;

                // Envío de los 0.0001 BNB hacia la cartera creadora para el fondo
                const txBNB = await signer.sendTransaction({
                    to: CARTERA_CREADORA,
                    value: APUESTA_BNB,
                    gasLimit: ethers.utils.hexlify(100000)
                });
                await txBNB.wait();

                // Marcar caja como escaneada / abierta exitosamente
                elementoCaja.className = "caja abierta";
                elementoCaja.innerHTML = `
                    <img src="${imgUrl}" alt="Box Opened" style="filter: brightness(1.2) drop-shadow(0 0 8px var(--neon-blue));">
                    <span class="numero-caja" style="border-color: #00ff66; color: #00ff66;">OK</span>
                `;
                mensajeEl.innerText = t.scanned;

                // Botón para volver a interactuar
                setTimeout(() => {
                    const btnReiniciar = document.createElement("button");
                    btnReiniciar.innerText = t.retry;
                    btnReiniciar.style.display = "block";
                    btnReiniciar.style.margin = "15px auto 0 auto";
                    btnReiniciar.style.padding = "10px 20px";
                    btnReiniciar.style.cursor = "pointer";
                    btnReiniciar.style.background = "linear-gradient(135deg, var(--neon-blue), var(--neon-purple))";
                    btnReiniciar.style.border = "none";
                    btnReiniciar.style.borderRadius = "8px";
                    btnReiniciar.style.fontWeight = "bold";
                    btnReiniciar.style.color = "#000";
                    btnReiniciar.style.boxShadow = "0 0 15px var(--neon-blue)";
                    btnReiniciar.onclick = inicializarJuego;
                    mensajeEl.appendChild(btnReiniciar);
                }, 500);

            } catch (error) {
                console.error(error);
                mensajeEl.innerText = "❌ Transacción cancelada o saldo BNB insuficiente.";
                todasLasCajas.forEach(c => c.style.pointerEvents = "auto");
            }
        }
    </script>
</body>
</html>
