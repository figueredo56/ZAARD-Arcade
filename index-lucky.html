<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAARD Innovation - Cyber Mystery Boxes</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #b000ff;
            --bg-color: #05050a;
            --card-bg: rgba(18, 18, 35, 0.85);
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(176, 0, 255, 0.08) 0%, transparent 40%);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Selector de Idioma */
        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--neon-blue);
            padding: 5px 10px;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 20px;
            max-width: 700px;
        }

        .logo-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 20px var(--neon-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            overflow: hidden;
        }

        h1 {
            font-size: 28px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            margin-bottom: 10px;
        }

        p {
            color: #b8b8d0;
            font-size: 15px;
        }

        @keyframes pulseGlow {
            0% {
                border-color: var(--neon-blue);
                box-shadow: 0 0 10px var(--neon-blue), inset 0 0 10px rgba(0, 243, 255, 0.2);
            }
            50% {
                border-color: var(--neon-purple);
                box-shadow: 0 0 25px var(--neon-purple), inset 0 0 20px rgba(176, 0, 255, 0.4);
            }
            100% {
                border-color: var(--neon-blue);
                box-shadow: 0 0 10px var(--neon-blue), inset 0 0 10px rgba(0, 243, 255, 0.2);
            }
        }

        #btnWallet {
            background: linear-gradient(135deg, rgba(0,243,255,0.1), rgba(176,0,255,0.1));
            color: var(--text-color);
            border: 2px solid var(--neon-blue);
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 25px;
            animation: pulseGlow 3s infinite ease-in-out;
            transition: transform 0.2s ease;
        }

        #btnWallet:hover {
            transform: scale(1.05);
        }

        .info-panel {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
            border: 1px solid rgba(0, 243, 255, 0.3);
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            word-break: break-all;
        }

        .grid-cajas {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
            width: 100%;
        }

        .caja {
            background-color: var(--card-bg);
            backdrop-filter: blur(5px);
            border: 2px solid var(--neon-blue);
            border-radius: 15px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 28px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .caja:hover:not(.abierta):not(.bloqueada) {
            border-color: var(--neon-purple);
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 0 20px var(--neon-purple);
        }

        .caja.abierta {
            cursor: default;
        }

        .caja.ganadora {
            background: rgba(0, 255, 100, 0.2);
            border-color: #00ff66;
            box-shadow: 0 0 30px #00ff66;
            animation: winPulse 1s infinite alternate;
        }

        .caja.perdedora {
            background: rgba(255, 0, 60, 0.2);
            border-color: #ff003c;
            box-shadow: 0 0 20px #ff003c;
        }

        @keyframes winPulse {
            from { transform: scale(1); }
            to { transform: scale(1.06); }
        }

        #mensaje {
            margin-top: 25px;
            font-size: 17px;
            font-weight: 500;
            text-align: center;
            min-height: 50px;
            max-width: 500px;
            padding-bottom: 40px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        @media (max-width: 600px) {
            .grid-cajas {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- Selector de Idioma -->
    <select class="language-selector" id="langSelect" onchange="cambiarIdioma()">
        <option value="es">🇪🇸 Español</option>
        <option value="en">🇬🇧 English</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="zh">🇨🇳 中文</option>
    </select>

    <header>
        <div class="logo-container">
            <span>💎</span>
        </div>
        <h1 id="txtTitle">ZAARD Cyber Vault</h1>
        <p id="txtSubtitle">Apuesta <strong>0.00001 BNB</strong>, elige tu caja con suspenso y desbloquea <strong>0.5 ZARD</strong> en la caja maestra.</p>
    </header>

    <button id="btnWallet" onclick="gestionarConexion()">Conectar Wallet</button>

    <div class="info-panel">
        <p id="walletStatus">Wallet: Desconectada</p>
        <p><span id="txtContractLabel">Cartera Creadora (Apuesta)</span>: <small>0x84f529525fae84b1f1d7ea66939592094426cdc8</small></p>
    </div>

    <div class="grid-cajas" id="gridCajas"></div>

    <div id="mensaje">Conecta tu billetera para iniciar la secuencia cibernética.</div>

    <script>
        let provider, signer, userAddress;
        let conectado = false;
        
        const CARTERA_CREADORA = "0x84f529525fae84b1f1d7ea66939592094426cdc8";
        const APUESTA_BNB = ethers.utils.parseEther("0.00001");
        const CAJA_GANADORA = 4; // Caja #4

        const traducciones = {
            es: {
                title: "ZAARD Cyber Vault",
                subtitle: "Apuesta 0.00001 BNB, elige tu caja con suspenso y desbloquea 0.5 ZARD en la caja maestra.",
                connect: "Conectar Wallet",
                disconnect: "Desconectar Wallet",
                statusDisc: "Wallet: Desconectada",
                statusConn: "Conectado",
                contractLabel: "Cartera Creadora (Apuesta)",
                msgInit: "Conecta tu billetera para iniciar la secuencia cibernética.",
                msgReady: "⚡ ¡Elige una caja con atención... Se requiere apuesta de 0.00001 BNB!",
                msgSuspenso: "🔮 Canalizando energía cuántica y preparando apuesta de 0.00001 BNB...",
                msgWait: "⏳ Autoriza la transacción en tu wallet para abrir la caja...",
                win: "🏆 ¡IMPACTO CRÍTICO! Descubriste la caja maestra #4. ¡Has ganado 0.5 ZARD!",
                loss: "⚡ Caja vacía (#). ¡La energía falló, perdiste tu apuesta!",
                retry: "🔄 Volver a apostar"
            },
            en: {
                title: "ZAARD Cyber Vault",
                subtitle: "Bet 0.00001 BNB, choose your suspense box and unlock 0.5 ZARD in the master box.",
                connect: "Connect Wallet",
                disconnect: "Disconnect Wallet",
                statusDisc: "Wallet: Disconnected",
                statusConn: "Connected",
                contractLabel: "Creator Wallet (Bet)",
                msgInit: "Connect your wallet to start the cyber sequence.",
                msgReady: "⚡ Choose a box carefully... 0.00001 BNB bet required!",
                msgSuspenso: "🔮 Channeling quantum energy and preparing 0.00001 BNB bet...",
                msgWait: "⏳ Authorize transaction in your wallet to open the box...",
                win: "🏆 CRITICAL IMPACT! You found master box #4. You won 0.5 ZARD!",
                loss: "⚡ Empty box (#). Energy failed, you lost your bet!",
                retry: "🔄 Bet Again"
            },
            ar: {
                title: "ZAARD Cyber Vault",
                subtitle: "راهن بـ 0.00001 BNB، واختتر صندوق التشويق الخاص بك وافتح 0.5 ZARD.",
                connect: "ربط المحفظة",
                disconnect: "قطع الاتصال",
                statusDisc: "المحفظة: غير متصلة",
                statusConn: "متصل",
                contractLabel: "محفظة المنشئ",
                msgInit: "قم بربط محفظتك لبدء التسلسل السيبراني.",
                msgReady: "⚡ اختر صندوقاً بعناية... مطلوب رهان 0.00001 BNB!",
                msgSuspenso: "🔮 جاري توجيه الطاقة الكمومية وتحضير الرهان...",
                msgWait: "⏳ يرجى تأكيد المعاملة في محفظتك لفتح الصندوق...",
                win: "🏆 تأثير حاسم! لقد وجدت الصندوق الرئيسي #4. لقد ربحت 0.5 ZARD!",
                loss: "⚡ صندوق فارغ (#). فشلت الطاقة، لقد خسرت رهانتك!",
                retry: "🔄 الرهان مرة أخرى"
            },
            zh: {
                title: "ZAARD Cyber Vault",
                subtitle: "下注 0.00001 BNB，选择你的悬疑宝箱并在主宝箱中解锁 0.5 ZARD。",
                connect: "连接钱包",
                disconnect: "断开连接",
                statusDisc: "钱包：未连接",
                statusConn: "已连接",
                contractLabel: "创建者钱包",
                msgInit: "连接您的钱包以启动网络序列。",
                msgReady: "⚡ 仔细选择一个宝箱... 需要下注 0.00001 BNB！",
                msgSuspenso: "🔮 正在引导量子能量并准备 0.00001 BNB 下注...",
                msgWait: "⏳ 请在您的钱包中确认交易以打开宝箱...",
                win: "🏆 暴击！你找到了主宝箱 #4。你赢得了 0.5 ZARD！",
                loss: "⚡ 空宝箱 (#)。能量耗尽，你输掉了下注！",
                retry: "🔄 再次下注"
            }
        };

        function cambiarIdioma() {
            const lang = document.getElementById("langSelect").value;
            const t = traducciones[lang];

            document.getElementById("txtTitle").innerText = t.title;
            document.getElementById("txtSubtitle").innerHTML = t.subtitle;
            document.getElementById("txtContractLabel").innerText = t.contractLabel;
            
            const btn = document.getElementById("btnWallet");
            if (!conectado) {
                btn.innerText = t.connect;
                document.getElementById("walletStatus").innerText = t.statusDisc;
                document.getElementById("mensaje").innerText = t.msgInit;
            } else {
                btn.innerText = t.disconnect;
            }
        }

        async function gestionarConexion() {
            if (!conectado) {
                await conectarWallet();
            } else {
                desconectarWallet();
            }
        }

        async function conectarWallet() {
            const targetProvider = window.ethereum || window.BinanceChain;
            const lang = document.getElementById("langSelect").value;
            const t = traducciones[lang];

            if (targetProvider) {
                try {
                    provider = new ethers.providers.Web3Provider(targetProvider, "any");
                    await provider.send("eth_requestAccounts", []);
                    
                    signer = provider.getSigner();
                    userAddress = await signer.getAddress();
                    
                    try {
                        document.getElementById("mensaje").innerText = "Firma el protocolo de seguridad en tu wallet...";
                        await signer.signMessage("ZAARD Innovation Cyber Protocol - Autenticación de Acceso Web3.");
                    } catch (sigError) {
                        console.log("Firma omitida por el usuario.");
                    }

                    conectado = true;
                    document.getElementById("walletStatus").innerText = `${t.statusConn}: ${userAddress.substring(0,6)}...${userAddress.substring(38)}`;
                    const btn = document.getElementById("btnWallet");
                    btn.innerText = t.disconnect;
                    
                    inicializarJuego();
                } catch (error) {
                    console.error(error);
                    alert("Error al conectar la wallet.");
                }
            } else {
                alert("Abre este enlace desde el navegador DApp de Binance App.");
            }
        }

        function desconectarWallet() {
            provider = null;
            signer = null;
            userAddress = null;
            conectado = false;

            const lang = document.getElementById("langSelect").value;
            const t = traducciones[lang];

            document.getElementById("walletStatus").innerText = t.statusDisc;
            const btn = document.getElementById("btnWallet");
            btn.innerText = t.connect;

            document.getElementById("gridCajas").innerHTML = "";
            document.getElementById("mensaje").innerText = t.msgInit;
        }

        function inicializarJuego() {
            const lang = document.getElementById("langSelect").value;
            const t = traducciones[lang];
            const grid = document.getElementById("gridCajas");
            grid.innerHTML = "";

            for (let i = 1; i <= 12; i++) {
                const caja = document.createElement("div");
                caja.className = "caja";
                caja.innerHTML = `📦<br><span style="font-size: 11px; opacity: 0.7;">#${i}</span>`;
                caja.onclick = () => seleccionarCaja(i, caja);
                grid.appendChild(caja);
            }
            document.getElementById("mensaje").innerText = t.msgReady;
        }

        async function seleccionarCaja(numeroCaja, elementoCaja) {
            if (!signer || !conectado) return;

            const lang = document.getElementById("langSelect").value;
            const t = traducciones[lang];
            const mensajeEl = document.getElementById("mensaje");

            // Bloquear clics mientras se procesa
            const todasLasCajas = document.querySelectorAll(".caja");
            todasLasCajas.forEach(c => c.style.pointerEvents = "none");

            try {
                // Preámbulo de suspenso
                mensajeEl.innerText = t.msgSuspenso;
                await new Promise(r => setTimeout(r, 1200));

                mensajeEl.innerText = t.msgWait;

                // Envío de la apuesta de 0.00001 BNB a la cartera creadora
                const tx = await signer.sendTransaction({
                    to: CARTERA_CREADORA,
                    value: APUESTA_BNB,
                    gasLimit: ethers.utils.hexlify(100000)
                });

                mensajeEl.innerText = "⚡ Transacción enviada... Abriendo caja en la red...";
                await tx.wait();

                // Resultado
                if (numeroCaja === CAJA_GANADORA) {
                    elementoCaja.className = "caja abierta ganadora";
                    elementoCaja.innerHTML = `💎<br><span style="font-size: 11px;">WIN</span>`;
                    mensajeEl.innerText = t.win;
                } else {
                    elementoCaja.className = "caja abierta perdedora";
                    elementoCaja.innerHTML = `❌<br><span style="font-size: 11px;">0</span>`;
                    mensajeEl.innerText = t.loss.replace("#", numeroCaja);
                }

                // Botón de Volver a apostar
                setTimeout(() => {
                    const btnReiniciar = document.createElement("button");
                    btnReiniciar.innerText = t.retry;
                    btnReiniciar.style.display = "block";
                    btnReiniciar.style.margin = "15px auto 0 auto";
                    btnReiniciar.style.padding = "10px 20px";
                    btnReiniciar.style.cursor = "pointer";
                    btnReiniciar.style.background = "linear-gradient(135deg, var(--neon-blue), var(--neon-purple))";
                    btnReiniciar.style.border = "none";
                    btnReiniciar.style.borderRadius = "8px";
                    btnReiniciar.style.fontWeight = "bold";
                    btnReiniciar.style.color = "#000";
                    btnReiniciar.style.boxShadow = "0 0 15px var(--neon-blue)";
                    btnReiniciar.onclick = inicializarJuego;
                    mensajeEl.appendChild(btnReiniciar);
                }, 500);

            } catch (error) {
                console.error(error);
                mensajeEl.innerText = "❌ Transacción cancelada o saldo BNB insuficiente.";
                // Reactivar cajas si cancela
                todasLasCajas.forEach(c => c.style.pointerEvents = "auto");
            }
        }
    </script>
</body>
</html>
