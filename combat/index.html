<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZAARD COMBAT PRO</title>
    <!-- Ethers.js para Web3 -->
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap');

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #020006; color: #fff; font-family: 'Rajdhani', sans-serif; 
            overflow: hidden; touch-action: none; user-select: none;
        }
        
        .espacio-bg {
            background-color: #020005;
            background-image: 
                radial-gradient(circle at 20% 25%, rgba(147, 51, 234, 0.28) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(34, 197, 94, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(88, 28, 135, 0.3) 0%, transparent 55%),
                radial-gradient(rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.05) 1px, transparent 15px),
                radial-gradient(rgba(34, 197, 94, 0.4), rgba(34, 197, 94, 0.02) 2px, transparent 35px),
                radial-gradient(white, rgba(255,255,255,.12) 1px, transparent 29px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 220px 220px, 380px 380px, 290px 290px;
            background-position: 0 0, 0 0, 0 0, 15px 15px, 120px 160px, 50px 70px;
            background-attachment: fixed;
        }

        .screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; 
            background: linear-gradient(rgba(2,0,6,0.85), rgba(2,0,6,0.92)), url('https://ipfs.io/ipfs/bafybeibmhheisrjxpxpcsh6goj6c4pxraz5xkcizn4aiyl5eamdc5qyc3m'); 
            background-size: cover; background-position: center;
        }
        
        .btn { 
            padding: 15px 30px; margin: 10px; border: 2px solid #9333ea; background: rgba(0,0,0,0.85); color: #fff; 
            cursor: pointer; font-weight: bold; font-size: 1.1rem; border-radius: 12px; width: 80%; max-width: 320px; 
            text-align: center; transition: all 0.2s; font-family: 'Rajdhani', sans-serif;
            box-shadow: 0 0 15px rgba(147, 51, 234, 0.3);
        }
        .btn:active { background: #9333ea; transform: scale(0.95); }
        
        .neon-glow { text-shadow: 0 0 10px rgba(147, 51, 234, 0.7), 0 0 20px rgba(34, 197, 94, 0.5); }
        .border-neon { box-shadow: 0 0 25px rgba(147, 51, 234, 0.25); border: 2px solid rgba(147, 51, 234, 0.7); }

        #canvasJuego { 
            display: none; width: 100%; height: 100%; 
        }

        #hud { 
            display: none; position: absolute; top: 15px; left: 15px; z-index: 50; 
            font-size: 1.1rem; pointer-events: none; background: rgba(0,0,0,0.85); 
            padding: 10px 15px; border-radius: 10px; border: 1px solid #9333ea;
            align-items: center; gap: 10px; box-shadow: 0 0 15px rgba(147,51,234,0.3);
        }

        .user-badge {
            display: flex; align-items: center; gap: 10px; background: rgba(147, 51, 234, 0.25);
            padding: 8px 16px; border-radius: 30px; border: 1px solid rgba(147, 51, 234, 0.6); margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(147,51,234,0.3);
        }
        .user-badge img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid #a855f7; }
    </style>
</head>
<body class="espacio-bg">

    <!-- BIENVENIDA -->
    <div id="bienvenida" class="screen">
        <div class="user-badge" id="perfil-info" style="display:none;">
            <img id="avatar-img" src="" alt="Avatar">
            <span id="nombre-usuario" style="font-weight: bold; color: #c084fc; font-size: 1.2rem;"></span>
        </div>
        <h1 id="txt-titulo" style="color:#9333ea; font-size: 2.8rem; text-align: center; margin-bottom: 5px;" class="neon-glow">ZAARD COMBAT</h1>
        <p id="txt-desc" style="text-align: center; padding: 0 20px; color: #d1d5db; margin-bottom: 25px;">¡Apuesta 0.0001 ZARD y gana 0.00015 ZARD! Destruye al enemigo sin que te toque.</p>
        <button class="btn" onclick="irAlMenu()" id="btn-entrar">ENTRAR</button>
        <button class="btn" style="border-color: #555; color: #aaa; font-size: 0.9rem; padding: 10px;" onclick="window.location.href='index.html'" id="btn-volver">⬅ VOLVER AL HUB</button>
    </div>

    <!-- MENÚ DE APUESTAS -->
    <div id="menu" class="screen" style="display:none;">
        <h2 id="txt-sel-apuesta" style="background:rgba(0,0,0,0.85); padding:12px 20px; border-radius: 12px; text-align: center; border: 1px solid #9333ea; margin-bottom: 20px;" class="neon-glow">SELECCIONA MODO DE JUEGO</h2>
        <button class="btn" onclick="iniciarJuego(true)" style="border-color: #22c55e;">APOSTAR 0.0001 ZARD</button>
        <button class="btn" style="border-color: #555; color: #ccc;" onclick="iniciarJuego(false)" id="btn-invitado">INVITADO (GRATIS)</button>
        <button class="btn" style="border-color: #7c3aed; color: #d8b4fe; font-size: 0.9rem; padding: 10px; margin-top: 15px;" onclick="document.getElementById('menu').style.display='none'; document.getElementById('bienvenida').style.display='flex';" id="btn-atras">⬅ VOLVER</button>
    </div>

    <!-- JUEGO -->
    <div id="hud">
        <span id="txt-hud-tiempo">Tiempo:</span> <span id="timer">60</span>s | <span id="txt-hud-destruidos">Destruidos:</span> <span id="score">0</span>
    </div>
    <canvas id="canvasJuego"></canvas>

    <script>
        const LS_IDIOMA = localStorage.getItem('zaard_lang') || 'es';
        
        const traducciones = {
            es: {
                titulo: "ZAARD COMBAT",
                desc: "¡Apuesta 0.0001 ZARD y gana 0.00015 ZARD! Destruye al enemigo sin que te toque.",
                entrar: "ENTRAR",
                volver: "⬅ VOLVER AL HUB",
                selApuesta: "SELECCIONA MODO DE JUEGO",
                invitado: "INVITADO (GRATIS)",
                atras: "⬅ VOLVER",
                tiempo: "Tiempo:",
                destruidos: "Destruidos:",
                msgTiempo: "¡TIEMPO AGOTADO! Sobreviviste pero no lograste los puntos.",
                msgDerrota: "¡TE TOCARON! Perdiste la apuesta (enviada a quema).",
                msgVictoria: "¡VICTORIA ÉPICA! Se han acreditado 0.00015 ZARD a tu cartera.",
                errorWallet: "Necesitas instalar MetaMask o usar el navegador de TrustWallet.",
                errorTx: "Transacción de apuesta cancelada o fallida.",
                msgZardInfo: "Conectando contrato ZARD (0x3468...4d65). Confirma la transferencia de 0.0001 ZARD."
            },
            en: {
                titulo: "ZAARD COMBAT",
                desc: "Bet 0.0001 ZARD and win 0.00015 ZARD! Destroy the enemy without getting hit.",
                entrar: "ENTER",
                volver: "⬅ BACK TO HUB",
                selApuesta: "SELECT GAME MODE",
                invitado: "GUEST (FREE)",
                atras: "⬅ BACK",
                tiempo: "Time:",
                destruidos: "Destroyed:",
                msgTiempo: "TIME OUT! You survived but didn't reach the score.",
                msgDerrota: "GOT HIT! You lost the bet (sent to burn address).",
                msgVictoria: "EPIC VICTORY! 0.00015 ZARD credited to your wallet.",
                errorWallet: "You need to install MetaMask or use TrustWallet browser.",
                errorTx: "Bet transaction canceled or failed.",
                msgZardInfo: "Connecting ZARD contract (0x3468...4d65). Confirm 0.0001 ZARD transfer."
            },
            zh: {
                titulo: "ZAARD 战斗",
                desc: "下注 0.0001 ZARD 并赢取 0.00015 ZARD！消灭敌人，避免被击中。",
                entrar: "进入",
                volver: "⬅ 返回大厅",
                selApuesta: "选择游戏模式",
                invitado: "访客（免费）",
                atras: "⬅ 返回",
                tiempo: "时间:",
                destruidos: "已消灭:",
                msgTiempo: "时间到！你存活了但未达到目标分数。",
                msgDerrota: "被击中！你输掉了赌注（已发送至销毁地址）。",
                msgVictoria: "史诗般的胜利！0.00015 ZARD 已存入您的钱包。",
                errorWallet: "您需要安装 MetaMask 或使用 TrustWallet 浏览器。",
                errorTx: "下注交易取消或失败。",
                msgZardInfo: "正在连接 ZARD 合约 (0x3468...4d65)。请确认转账 0.0001 ZARD。"
            }
        };

        const t = traducciones[LS_IDIOMA] || traducciones.es;

        document.getElementById('txt-titulo').innerText = t.titulo;
        document.getElementById('txt-desc').innerText = t.desc;
        document.getElementById('btn-entrar').innerText = t.entrar;
        document.getElementById('btn-volver').innerText = t.volver;
        document.getElementById('txt-sel-apuesta').innerText = t.selApuesta;
        document.getElementById('btn-invitado').innerText = t.invitado;
        document.getElementById('btn-atras').innerText = t.atras;
        document.getElementById('txt-hud-tiempo').innerText = t.tiempo;
        document.getElementById('txt-hud-destruidos').innerText = t.destruidos;

        // Carga correcta del nombre y avatar desde el Hub
        const usuarioGuardado = localStorage.getItem('zaard_nombre');
        const avatarGuardado = localStorage.getItem('zaard_avatar');
        
        if (usuarioGuardado && avatarGuardado) {
            document.getElementById('nombre-usuario').innerText = usuarioGuardado;
            document.getElementById('avatar-img').src = avatarGuardado;
            document.getElementById('perfil-info').style.display = 'flex';
        }

        const ZARD_CONTRACT = "0x3468ea4e6ce13ec4c7f8651f7efc6aa6046f4d65";
        const BURN_ADDRESS = "0x0000000000000000000000000000000000000000";
        
        const ERC20_ABI = [
            "function transfer(address to, uint256 amount) public returns (bool)",
            "function balanceOf(address account) view returns (uint256)"
        ];

        const canvas = document.getElementById('canvasJuego');
        const ctx = canvas.getContext('2d');
        const imgAsset = new Image(); 
        imgAsset.src = 'https://ipfs.io/ipfs/bafybeibmhheisrjxpxpcsh6goj6c4pxraz5xkcizn4aiyl5eamdc5qyc3m';
        
        let nave = { x: 0, y: 0, w: 55, h: 55 };
        let enemigos = [];
        let balas = [];
        let puntos = 0;
        let timeLeft = 60;
        let juegoActivo = false;
        let modoApuestaActivo = false;
        let crono;
        let signerGlobal = null;
        let userAddress = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSnd(freq, dur, type = 'square') {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let o = audioCtx.createOscillator();
            let g = audioCtx.createGain();
            o.type = type;
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.08, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + dur);
        }

        function irAlMenu() { 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            document.getElementById('bienvenida').style.display = 'none'; 
            document.getElementById('menu').style.display = 'flex'; 
        }

        async function terminarJuego(resultado) { 
            juegoActivo = false; 
            clearInterval(crono); 

            if (modoApuestaActivo && signerGlobal && userAddress) {
                try {
                    const zardToken = new ethers.Contract(ZARD_CONTRACT, ERC20_ABI, signerGlobal);
                    const decimals = 18; 

                    if (resultado === 'victoria') {
                        alert(t.msgVictoria);
                    } else if (resultado === 'derrota' || resultado === 'tiempo') {
                        alert(t.msgDerrota);
                        const montoQuema = ethers.utils.parseUnits("0.0001", decimals);
                        const txBurn = await zardToken.transfer(BURN_ADDRESS, montoQuema);
                        await txBurn.wait();
                    }
                } catch(e) {
                    console.error("Error en transacción Web3:", e);
                }
            } else {
                if (resultado === 'victoria') alert(t.msgVictoria);
                else alert(t.msgDerrota);
            }

            window.location.href = 'index.html'; 
        }

        async function iniciarJuego(apostar) {
            modoApuestaActivo = apostar;

            if(apostar) {
                if(!window.ethereum) { alert(t.errorWallet); return; }
                try { 
                    alert(t.msgZardInfo);
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    signerGlobal = provider.getSigner();
                    userAddress = await signerGlobal.getAddress();

                    const zardToken = new ethers.Contract(ZARD_CONTRACT, ERC20_ABI, signerGlobal);
                    const montoApuesta = ethers.utils.parseUnits("0.0001", 18);

                    const tx = await zardToken.transfer(ZARD_CONTRACT, montoApuesta);
                    await tx.wait(); 
                } catch(e) { 
                    alert(t.errorTx); 
                    return; 
                }
            }
            
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            canvas.style.display = 'block';
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight;
            
            nave.x = canvas.width / 2 - 27;
            nave.y = canvas.height - 120;
            
            juegoActivo = true;
            
            crono = setInterval(() => { 
                if(!juegoActivo) return;
                if(timeLeft > 0) {
                    timeLeft--;
                    document.getElementById('timer').innerText = timeLeft;
                } else { 
                    terminarJuego('tiempo'); 
                }
            }, 1000);
            
            bucle(); 
        }

        window.addEventListener('touchmove', (e) => { 
            nave.x = e.touches[0].clientX - 27; 
            if(nave.x < 0) nave.x = 0;
            if(nave.x > canvas.width - 55) nave.x = canvas.width - 55;
        }, { passive: false });

        window.addEventListener('mousemove', (e) => {
            if(!juegoActivo) return;
            nave.x = e.clientX - 27;
            if(nave.x < 0) nave.x = 0;
            if(nave.x > canvas.width - 55) nave.x = canvas.width - 55;
        });

        function bucle() {
            if(!juegoActivo) return;
            
            ctx.fillStyle = 'rgba(2, 0, 6, 0.4)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar Nave
            ctx.drawImage(imgAsset, nave.x, nave.y, nave.w, nave.h);

            // Generar Enemigos
            if(Math.random() < 0.04) enemigos.push({x: Math.random()*(canvas.width-45), y: -50});
            
            for(let i = enemigos.length - 1; i >= 0; i--) {
                let e = enemigos[i];
                e.y += 4.5; 
                ctx.drawImage(imgAsset, e.x, e.y, 45, 45);
                
                // Colisión Nave-Enemigo
                if(e.x < nave.x + 45 && e.x + 45 > nave.x && e.y < nave.y + 55 && e.y + 45 > nave.y) {
                    playSnd(120, 0.4, 'sawtooth'); 
                    terminarJuego('derrota');
                    return;
                }
                
                if(e.y > canvas.height) enemigos.splice(i, 1);
            }
            
            // Disparos Automáticos
            if(Math.random() < 0.18) { 
                balas.push({x: nave.x + 25, y: nave.y});
                playSnd(450, 0.04, 'triangle'); 
            }
            
            for(let i = balas.length - 1; i >= 0; i--) {
                let b = balas[i];
                b.y -= 14; 
                ctx.fillStyle = '#22c55e'; 
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#22c55e';
                ctx.fillRect(b.x, b.y, 5, 15); 
                ctx.shadowBlur = 0; 
                
                let balaImpactada = false;
                
                for(let ei = enemigos.length - 1; ei >= 0; ei--) {
                    let e = enemigos[ei];
                    if(b.x > e.x && b.x < e.x+45 && b.y > e.y && b.y < e.y+45) {
                        enemigos.splice(ei, 1); 
                        balaImpactada = true;
                        puntos++;
                        document.getElementById('score').innerText = puntos;
                        playSnd(750, 0.08, 'sine'); 
                        
                        if(puntos >= 300) { 
                            terminarJuego('victoria'); 
                            return; 
                        }
                        break;
                    }
                }
                
                if(balaImpactada || b.y < 0) balas.splice(i, 1);
            }
            
            requestAnimationFrame(bucle);
        }
    </script>
</body>
</html>
