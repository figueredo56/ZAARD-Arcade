<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZAARD LUCKY CHEST - Protocolo Panga</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap');
        
        body { 
            margin: 0; 
            padding: 0;
            background-color: #070112;
            font-family: 'Rajdhani', sans-serif; 
            color: #fff;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #070112; z-index: 2000;
            display: flex; justify-content: center; align-items: center; color: #00ffff; font-weight: bold; font-size: 20px;
        }

        #modal-bienvenida {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 30%, #3a0ca3 0%, #10002b 60%, #050014 100%);
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 30px 30px;
            z-index: 1500;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; text-align: center;
        }
        .modal-card {
            background: rgba(15, 5, 45, 0.92);
            border: 2px solid #00ffff; border-radius: 22px;
            padding: 25px; width: 100%; max-width: 380px;
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(123, 44, 191, 0.4);
            backdrop-filter: blur(8px);
        }
        .btn-accion {
            width: 100%; padding: 14px; margin: 10px 0; border: none; border-radius: 12px;
            font-weight: bold; font-size: 17px; cursor: pointer; text-transform: uppercase;
            font-family: 'Rajdhani', sans-serif; transition: 0.2s;
        }
        .btn-accion:hover { transform: scale(1.03); }
        .btn-invitado { background: linear-gradient(90deg, #10b981, #059669); color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
        .btn-web3 { background: linear-gradient(90deg, #00ffff, #0088cc); color: #000; box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); }

        .user-panel {
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            width: 94%; max-width: 440px; height: 64px;
            background: rgba(24, 5, 54, 0.95);
            border: 2px solid rgba(0, 255, 255, 0.8); border-radius: 16px;
            display: flex; align-items: center; padding: 0 12px; box-sizing: border-box;
            box-shadow: 0 0 15px rgba(0,255,255,0.3); z-index: 10;
        }
        .user-avatar {
            width: 44px; height: 44px; border-radius: 50%; border: 2px solid #d946ef;
            object-fit: cover; margin-right: 10px; box-shadow: 0 0 8px #d946ef;
        }
        .user-info { flex-grow: 1; text-align: left; }
        .user-name { font-size: 16px; color: #00ffff; font-weight: bold; line-height: 1.1; text-shadow: 0 0 4px #00ffff; }
        .user-sub { font-size: 12px; color: #e879f9; font-weight: bold; }
        .btn-salir {
            background: none; border: none; color: #ff6b6b; font-size: 15px; font-weight: bold;
            cursor: pointer; font-family: 'Rajdhani', sans-serif; text-transform: uppercase; transition: 0.2s;
        }
        .btn-salir:hover { color: #ff4444; }

        .game-container {
            margin-top: 75px; width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center;
        }
        h1 { font-size: 1.7rem; color: #c77dff; text-shadow: 0 0 15px #7b2cbf; margin: 8px 0; text-transform: uppercase; }
        
        .chests-container { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 2px; padding: 0 10px; width: 100%; box-sizing: border-box; 
        }
        .chest { 
            aspect-ratio: 1/1; cursor: pointer; border: 2px solid #c77dff; border-radius: 10px; 
            overflow: hidden; transition: 0.1s; background: rgba(50, 10, 90, 0.5);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 6px rgba(199,125,255,0.3);
        }
        .chest img { width: 85%; height: 85%; object-fit: cover; transition: 0.1s; filter: brightness(0.75); border-radius: 8px; }
        
        .chest.active { 
            transform: scale(1.2); border-color: #00ffff; box-shadow: 0 0 25px #00ffff; background: rgba(0,255,255,0.4); 
            z-index: 5;
        }
        .chest.active img { filter: brightness(1.25); }

        #status-msg { 
            font-size: 1.1rem; margin-top: 10px; color: #e0aaff; font-weight: bold; padding: 0 10px; 
            text-shadow: 1px 1px 6px #000; min-height: 40px; display: flex; align-items: center; justify-content: center; text-align: center;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.4); opacity: 0; }
            80% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
        .mensaje-ganaste { color: #10b981 !important; text-shadow: 0 0 12px #10b981 !important; animation: popIn 0.4s ease-out; }
        .mensaje-perdiste { color: #ff4d6d !important; text-shadow: 0 0 12px #ff4d6d !important; animation: popIn 0.4s ease-out; }

        .btn-reiniciar {
            padding: 10px 30px; background: linear-gradient(45deg, #7b2cbf, #3c096c); cursor: pointer; 
            border: 2px solid #c77dff; border-radius: 12px; color: white; font-weight: bold; font-size: 1.1rem; 
            margin-top: 8px; text-transform: uppercase; box-shadow: 0 0 15px #7b2cbf; font-family: 'Rajdhani', sans-serif;
            transition: 0.2s;
        }
        .btn-reiniciar:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="loading-screen">CARGANDO...</div>

    <!-- MODAL DE BIENVENIDA -->
    <div id="modal-bienvenida">
        <div class="modal-card">
            <h2 style="color: #00ffff; margin-top: 0; font-size: 1.5rem;">⚡ PRUEBA DE PROTOCOLO ⚡</h2>
            <p style="font-size: 14px; color: #ccc; margin-bottom: 15px; line-height: 1.3;">
                Modo de prueba: Cofre 7 (Token Negro) otorga 0.0001 ZARD de recompensa. Sin riesgo de apuestas.
            </p>
            <button class="btn-accion btn-invitado" onclick="elegirModo()">MODO INVITADO 🚀</button>
            <button class="btn-accion btn-web3" onclick="conectarYJugar()">CONECTAR BILLETERA WEB3</button>
        </div>
    </div>

    <!-- AUDIO DE FONDO -->
    <audio id="zaard-audio" loop>
        <source src="El%20Chupulún%20de%20Zaard.mp3" type="audio/mpeg">
    </audio>

    <!-- PANEL SUPERIOR -->
    <div class="user-panel">
        <img id="img-avatar-usr" class="user-avatar" src="" alt="Avatar">
        <div class="user-info">
            <div id="txt-nombre-usr" class="user-name">Jugador</div>
            <div class="user-sub">LUCKY CHEST TEST</div>
        </div>
        <button class="btn-salir" onclick="irAlMenuPrincipal()">SALIR</button>
    </div>

    <!-- ÁREA DE JUEGO (16 COFRES) -->
    <div class="game-container">
        <h1>⚡ ELIJA SU COFRE ⚡</h1>
        
        <div class="chests-container" id="grid-cofres">
            <!-- Se generan dinámicamente los 16 cofres -->
        </div>

        <div id="status-msg">Seleccione su cofre para la prueba...</div>
        <button class="btn-reiniciar" onclick="reiniciarJuego()">OTRA RONDA</button>
    </div>

    <script>
        const LS_NOMBRE = localStorage.getItem('zaard_nombre') || "Jugador Zaard";
        const LS_AVATAR_URL = localStorage.getItem('zaard_avatar') || 'https://raw.githubusercontent.com/figueredo56/ZAARD-Arcade/refs/heads/main/Gemini_Generated_Image_lhyyv2lhyyv2lhyy_1.png';

        const imagenesCofres = [
            "https://ipfs.io/ipfs/bafybeicsg3uv7e3gcl7h7ibq5io5frmrpcbvkg24igufpyek26pzqmrrr4",
            "https://ipfs.io/ipfs/bafybeihqftstfjm3i32e3xm54xo52h6tpldlmfkwc2z6tx5qthbonyboue",
            "https://ipfs.io/ipfs/bafybeid4eh5si4tdy3kpqgtnd4l2z6ehac3rkd4vjmsgdb5gqbs2vcox34",
            "https://ipfs.io/ipfs/bafybeiefhnawny7nlgixveiia7aaougqxsird6or4nws52vp36ndbfvixa",
            "https://ipfs.io/ipfs/bafybeibmhheisrjxpxpcsh6goj6c4pxraz5xkcizn4aiyl5eamdc5qyc3m",
            "https://ipfs.io/ipfs/bafybeiheko4izm53qfmhejmvz5elek4hb2lp3weaduwndvrvpxdamwklue",
            "https://ipfs.io/ipfs/bafybeiggz26x26hncisti5s5y74ciuk4yuymtczhsbwdufoql2gidl57mu", // Coincide con el cofre 7 (token negro)
            "https://ipfs.io/ipfs/bafybeiginlvb63afmlicnvsx4fwfekanoipydzgzv3ay7njpvq6nm4zzym",
            LS_AVATAR_URL,
            "https://raw.githubusercontent.com/figueredo56/ZAARD-Arcade/refs/heads/main/Gemini_Generated_Image_lhyyv2lhyyv2lhyy_1.png",
            "https://ipfs.io/ipfs/bafybeihqftstfjm3i32e3xm54xo52h6tpldlmfkwc2z6tx5qthbonyboue",
            "https://ipfs.io/ipfs/bafybeid4eh5si4tdy3kpqgtnd4l2z6ehac3rkd4vjmsgdb5gqbs2vcox34"
        ];

        const gridCofres = document.getElementById('grid-cofres');
        for (let i = 1; i <= 16; i++) {
            let imgUrl = imagenesCofres[(i - 1) % imagenesCofres.length];
            gridCofres.innerHTML += `
                <div class="chest" id="chest-${i}" onclick="jugarRuleta(${i})">
                    <img src="${imgUrl}" alt="Cofre ${i}">
                </div>
            `;
        }

        const TOKEN_ADDR = "0x3468EA4e6CE13Ec4C7f8651f7eFC6AA6046F4d65"; 
        const ABI_TRANSFER = [{"constant":false,"inputs":[{"name":"_to","type":"address"},{"name":"_value","type":"uint256"}],"name":"transfer","outputs":[{"name":"","type":"bool"}],"type":"function"}];
        const PREMIO_WEI = "100000000000000"; // 0.0001 ZARD

        let web3, contract, userAccount, esModoWeb3 = false;
        let juegoBloqueado = false;
        let musicaHabilitada = localStorage.getItem('zaard_musica') !== 'OFF';

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('txt-nombre-usr').innerText = LS_NOMBRE;
            document.getElementById('img-avatar-usr').src = LS_AVATAR_URL;

            const audio = document.getElementById('zaard-audio');
            audio.volume = 0.3;
            if (musicaHabilitada) {
                audio.play().catch(e => console.log("Audio pendiente"));
            }
            document.getElementById('loading-screen').style.display = 'none';
        });

        function elegirModo() {
            esModoWeb3 = false;
            document.getElementById('modal-bienvenida').style.display = 'none';
        }

        async function conectarYJugar() {
            if (window.ethereum) {
                try {
                    web3 = new Web3(window.ethereum);
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userAccount = accounts[0];
                    contract = new web3.eth.Contract(ABI_TRANSFER, TOKEN_ADDR);
                    esModoWeb3 = true;
                    alert("¡Wallet conectada para la prueba!");
                    document.getElementById('modal-bienvenida').style.display = 'none';
                } catch (e) { 
                    alert("Conexión cancelada."); 
                }
            } else { 
                alert("Por favor instala MetaMask."); 
            }
        }

        function irAlMenuPrincipal() {
            window.location.href = "index.html";
        }

        function reiniciarJuego() {
            if (juegoBloqueado) return;
            document.querySelectorAll('.chest').forEach(c => c.classList.remove('active'));
            const msg = document.getElementById('status-msg');
            msg.className = "";
            msg.innerText = "Seleccione su cofre para la prueba...";
        }

        // Función para enviar recompensa en modo prueba
        async function pagarRecompensa() {
            if (esModoWeb3 && contract && userAccount) {
                try {
                    // NOTA DE PRUEBA: Esto requeriría que el contrato permita transferir al usuario, 
                    // o simulará la orden de pago desde la interfaz expuesta.
                    await contract.methods.transfer(userAccount, PREMIO_WEI).send({ from: userAccount });
                } catch (e) { 
                    console.log("Error en pago de prueba:", e); 
                }
            }
        }

        async function jugarRuleta(cofreElegido) {
            if (juegoBloqueado) return;
            juegoBloqueado = true;

            const msg = document.getElementById('status-msg');
            msg.className = "";
            msg.innerText = "⚡ Escaneando tesoros de prueba...";

            // REGLA DE PRUEBA: Forzar la parada exacta en el cofre 7 (Token negro)
            const cofreGanador = 7;

            let cofreActual = Math.floor(Math.random() * 16) + 1;
            let velocidad = 25;
            let pasosTotales = 45;

            for (let i = 0; i < pasosTotales; i++) {
                document.querySelectorAll('.chest').forEach(c => c.classList.remove('active'));
                document.getElementById(`chest-${cofreActual}`).classList.add('active');
                
                await new Promise(r => setTimeout(r, velocidad));
                
                velocidad += Math.floor(i / 3) + 4;
                cofreActual = (cofreActual % 16) + 1;
            }

            // Forzar que siempre se detenga en el cofre 7 para esta prueba
            document.querySelectorAll('.chest').forEach(c => c.classList.remove('active'));
            document.getElementById(`chest-${cofreGanador}`).classList.add('active');

            setTimeout(async () => {
                if (cofreElegido === cofreGanador) {
                    msg.className = "mensaje-ganaste";
                    msg.innerHTML = `🎉 ¡EXCELENTE PRUEBA ${LS_NOMBRE}! ¡COFRE 7 GANADOR (0.0001 ZARD)! 🚀`;
                    if (esModoWeb3) {
                        await pagarRecompensa();
                    }
                } else {
                    msg.className = "mensaje-perdiste";
                    msg.innerHTML = `💪 El cofre ganador de la prueba era el 7 (Token negro). ¡Inténtalo de nuevo!`;
                }
                juegoBloqueado = false; 
            }, 300);
        }
    </script>
</body>
</html>
