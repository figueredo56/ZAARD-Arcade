<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZAARD ARCADE LUCKY | Modo Invitado & Reto Web3</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-blue: #00f2fe;
            --neon-purple: #b084cc;
            --neon-green: #00ff88;
            --gold: #f3ba2f;
            --pink: #f72585;
            --bg-dark: #030308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.16), transparent 55%),
                radial-gradient(circle at 15% 85%, rgba(176, 132, 204, 0.18), transparent 50%),
                radial-gradient(circle at 85% 85%, rgba(0, 255, 136, 0.15), transparent 50%),
                var(--bg-dark);
            color: #f1f5f9;
            padding: 20px;
            overflow-x: hidden;
        }

        .arcade-shell {
            position: relative;
            max-width: 920px;
            margin: 0 auto;
            background: rgba(6, 10, 24, 0.94);
            border: 2px solid var(--neon-blue);
            border-radius: 22px;
            padding: 28px;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.35), 0 0 70px rgba(0, 255, 136, 0.15);
        }

        .spark-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .arcade-content {
            position: relative;
            z-index: 2;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 22px;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.3rem, 2.8vw, 2rem);
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 16px rgba(0, 255, 136, 0.65);
        }

        .mode-badge {
            padding: 7px 14px;
            border-radius: 999px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            font-weight: 800;
            background: rgba(0, 255, 136, 0.16);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr; }
        }

        .stat-box {
            background: rgba(3, 12, 26, 0.9);
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #94a3b8;
            display: block;
            margin-bottom: 4px;
        }

        .stat-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--neon-blue);
        }

        .question-card {
            background: rgba(4, 15, 32, 0.92);
            border: 1px solid rgba(176, 132, 204, 0.5);
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .question-text {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.05rem, 2vw, 1.35rem);
            color: #fff;
            margin-bottom: 18px;
            line-height: 1.45;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        .opt-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(0, 242, 254, 0.45);
            color: #e2e8f0;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            transition: 0.22s;
        }

        .opt-btn:hover:not(:disabled) {
            border-color: var(--neon-green);
            background: rgba(0, 255, 136, 0.14);
            transform: translateY(-2px);
        }

        .opt-btn.correct {
            border-color: var(--neon-green);
            background: rgba(0, 255, 136, 0.25);
            color: #fff;
        }

        .opt-btn.wrong {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.22);
            color: #fecaca;
        }

        .feedback-box {
            min-height: 28px;
            margin-top: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--gold);
        }

        .actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
            color: #020810;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.88rem;
            cursor: pointer;
            transition: 0.25s;
        }

        .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
        }

        .btn-secondary {
            background: rgba(176, 132, 204, 0.16);
            color: #e9d5ff;
            border: 1px solid var(--neon-purple);
            padding: 11px 20px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="arcade-shell">
        <canvas class="spark-canvas" id="luckySparks"></canvas>
        <div class="arcade-content">
            <div class="top-bar">
                <div class="brand-title"><i class="fas fa-bolt"></i> ZAARD ARCADE LUCKY</div>
                <div class="mode-badge" id="guestStatusBadge">🎮 MODO INVITADO ACTIVO</div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-label">Fichas de Prueba (Invitado)</span>
                    <span class="stat-val" id="guestCredits">500 DEMO</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Puntos Ganados</span>
                    <span class="stat-val" id="scoreVal" style="color: var(--neon-green);">0 PTS</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Racha Actual</span>
                    <span class="stat-val" id="streakVal" style="color: var(--gold);">0 🔥</span>
                </div>
            </div>

            <div class="question-card">
                <div class="question-text" id="questionText">Cargando reto...</div>
                <div class="options-grid" id="optionsGrid"></div>
                <div class="feedback-box" id="feedbackBox"></div>
            </div>

            <div class="actions-row">
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button class="btn-primary" id="nextBtn" onclick="nextQuestion()">Siguiente Reto →</button>
                    <button class="btn-secondary" onclick="resetGuestDemo()">Reiniciar Invitado</button>
                </div>
                <a href="index.html" class="btn-secondary">← Volver al Tracker</a>
            </div>
        </div>
    </div>

    <script>
        const QUESTIONS = [
            {
                q: "¿Cuál es el motor y núcleo principal del ecosistema ZAARD INNOVATION?",
                opts: ["ZARD Token Core", "Un token memecoin sin utilidad", "Una red privada cerrada", "Un juego sin conexión"],
                ans: 0,
                reward: 120
            },
            {
                q: "¿En qué red operan los tokens ZARD, PANGA, ZARED y ZYM del tracker?",
                opts: ["BNB Smart Chain (BSC)", "Bitcoin Core Layer 1", "Litecoin Classic", "Dogecoin Network"],
                ans: 0,
                reward: 100
            },
            {
                q: "¿Qué representa el enfoque de PANGA dentro del ecosistema?",
                opts: ["Fuerza estratégica y GameFi", "Solo una imagen estática", "Un archivo de texto plano", "Un navegador web"],
                ans: 0,
                reward: 110
            },
            {
                q: "¿Por qué ofrecemos el Modo Invitado en ZAARD Arcade Lucky?",
                opts: ["Para probar el juego y animarse a jugar", "Para bloquear el acceso a usuarios", "Para ocultar las reglas", "Para detener el marcador"],
                ans: 0,
                reward: 130
            }
        ];

        let idx = 0;
        let credits = 500;
        let score = 0;
        let streak = 0;
        let answered = false;

        function renderQuestion() {
            answered = false;
            const item = QUESTIONS[idx % QUESTIONS.length];
            document.getElementById('questionText').textContent = `Reto #${idx + 1}: ${item.q}`;
            document.getElementById('feedbackBox').textContent = "Selecciona una respuesta para ganar puntos en modo invitado.";

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';

            item.opts.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.textContent = opt;
                btn.onclick = () => selectAnswer(i, btn);
                grid.appendChild(btn);
            });
        }

        function selectAnswer(choice, btn) {
            if (answered) return;
            answered = true;

            const item = QUESTIONS[idx % QUESTIONS.length];
            const allBtns = document.querySelectorAll('.opt-btn');
            allBtns.forEach(b => b.disabled = true);

            if (choice === item.ans) {
                btn.classList.add('correct');
                score += item.reward;
                credits += 50;
                streak += 1;
                document.getElementById('feedbackBox').textContent = `⚡ ¡Correcto! Ganaste +${item.reward} PTS y +50 DEMO en modo invitado.`;
            } else {
                btn.classList.add('wrong');
                allBtns[item.ans].classList.add('correct');
                credits = Math.max(0, credits - 25);
                streak = 0;
                document.getElementById('feedbackBox').textContent = `💡 Casi era esa. La respuesta correcta era: "${item.opts[item.ans]}". ¡Sigue probando!`;
            }

            updateHUD();
        }

        function nextQuestion() {
            idx += 1;
            renderQuestion();
        }

        function resetGuestDemo() {
            idx = 0;
            credits = 500;
            score = 0;
            streak = 0;
            updateHUD();
            renderQuestion();
        }

        function updateHUD() {
            document.getElementById('guestCredits').textContent = `${credits} DEMO`;
            document.getElementById('scoreVal').textContent = `${score} PTS`;
            document.getElementById('streakVal').textContent = `${streak} 🔥`;
        }

        // Chispas eléctricas en el juego
        (function () {
            const canvas = document.getElementById('luckySparks');
            const ctx = canvas.getContext('2d');
            let w = 0, h = 0;
            const colors = ['#00ff88', '#00f2fe', '#c084fc', '#ffffff'];
            const sparks = [];

            function resize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                w = canvas.width = Math.max(rect.width, 300);
                h = canvas.height = Math.max(rect.height, 300);
            }

            function makeSpark() {
                return {
                    x: Math.random() * (w || 600),
                    y: Math.random() * (h || 400),
                    vx: (Math.random() - 0.5) * 2.8,
                    vy: (Math.random() - 0.5) * 2.8,
                    r: Math.random() * 2.2 + 0.8,
                    a: Math.random() * 0.9 + 0.2,
                    d: Math.random() * 0.018 + 0.006,
                    c: colors[Math.floor(Math.random() * colors.length)]
                };
            }

            resize();
            window.addEventListener('resize', resize);
            for (let i = 0; i < 35; i++) sparks.push(makeSpark());

            function loop() {
                ctx.clearRect(0, 0, w, h);
                for (let i = 0; i < sparks.length; i++) {
                    const s = sparks[i];
                    s.x += s.vx;
                    s.y += s.vy;
                    s.a -= s.d;
                    if (s.a <= 0 || s.x < 0 || s.x > w || s.y < 0 || s.y > h) {
                        sparks[i] = makeSpark();
                        continue;
                    }
                    ctx.save();
                    ctx.globalAlpha = s.a;
                    ctx.fillStyle = s.c;
                    ctx.shadowColor = s.c;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                requestAnimationFrame(loop);
            }
            loop();
        })();

        updateHUD();
        renderQuestion();
    </script>
</body>
</html>
