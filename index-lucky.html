<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZAARD LUCKY CHEST - Protocolo Panga</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap');
        
        body { 
            margin: 0; 
            padding: 0;
            background-color: #070112; /* Fondo base */
            font-family: 'Rajdhani', sans-serif; 
            color: #fff;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #070112; z-index: 2000;
            display: flex; justify-content: center; align-items: center; color: #00ffff; font-weight: bold; font-size: 20px;
        }

        /* Fondo de Bienvenida Mejorado (Vórtice Cósmico) */
        #modal-bienvenida {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 50%, #240a6a 0%, #070112 70%), url('https://www.transparenttextures.com/patterns/stardust.png');
            background-blend-mode: overlay;
            z-index: 1500;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; text-align: center;
        }
        .modal-card {
            background: rgba(10, 3, 35, 0.85);
            border: 2px solid #00ffff; border-radius: 20px;
            padding: 30px; width: 100%; max-width: 400px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4), inset 0 0 15px rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }
        .btn-accion {
            width: 100%; padding: 16px; margin: 12px 0; border: none; border-radius: 12px;
            font-weight: bold; font-size: 18px; cursor: pointer; text-transform: uppercase;
            font-family: 'Rajdhani', sans-serif; transition: 0.2s;
        }
        .btn-accion:hover { transform: scale(1.03); }
        .btn-invitado { background: linear-gradient(90deg, #10b981, #059669); color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
        .btn-web3 { background: linear-gradient(90deg, #00ffff, #0088cc); color: #000; box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); }

        /* Panel Superior de Usuario (Estilo Panga) */
        .user-panel {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 460px; height: 80px;
            background: rgba(24, 5, 54, 0.95);
            border: 2px solid rgba(0, 255, 255, 0.8); border-radius: 18px;
            display: flex; align-items: center; padding: 0 15px; box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,255,255,0.3); z-index: 10;
        }
        .user-avatar {
            width: 58px; height: 58px; border-radius: 50%; border: 3px solid #d946ef;
            object-fit: cover; margin-right: 15px; box-shadow: 0 0 10px #d946ef;
        }
        .user-info { flex-grow: 1; text-align: left; }
        .user-name { font-size: 20px; color: #00ffff; font-weight: bold; line-height: 1.2; text-shadow: 0 0 5px #00ffff; }
        .user-sub { font-size: 14px; color: #e879f9; font-weight: bold; }
        .btn-salir {
            background: none; border: none; color: #ff6b6b; font-size: 16px; font-weight: bold;
            cursor: pointer; font-family: 'Rajdhani', sans-serif; text-transform: uppercase; transition: 0.2s;
        }
        .btn-salir:hover { color: #ff4444; text-shadow: 0 0 5px #ff4444; }

        /* Área de Juego y Ruleta de Cofres */
        .game-container {
            margin-top: 100px; width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center;
        }
        h1 { font-size: 2.5rem; color: #c77dff; text-shadow: 0 0 20px #7b2cbf; margin: 20px 0; text-transform: uppercase; }
        
        .chests-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 25px; padding: 0 10px; width: 100%; box-sizing: border-box; }
        .chest { 
            aspect-ratio: 1/1; cursor: pointer; border: 4px solid #c77dff; border-radius: 16px; 
            overflow: hidden; transition: 0.15s; background: rgba(50, 10, 90, 0.5);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px rgba(199,125,255,0.3);
        }
        .chest img { width: 80%; transition: 0.15s; filter: brightness(0.8); }
        
        /* Efecto Ruleta: Iluminación Activa (más lento al final) */
        .chest.active { 
            transform: scale(1.1); border-color: #00ffff; box-shadow: 0 0 25px #00ffff; background: rgba(0,255,255,0.3); 
            z-index: 5;
        }
        .chest.active img { filter: brightness(1.1); }

        /* Estado del Juego y Animación de Mensaje */
        #status-msg { 
            font-size: 1.6rem; margin-top: 30px; color: #e0aaff; font-weight: bold; padding: 0 20px; 
            text-shadow: 2px 2px 8px #000; min-height: 60px; display: flex; align-items: center; justify-content: center;
        }
        
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .mensaje-ganaste { color: #10b981 !important; text-shadow: 0 0 15px #10b981 !important; animation: popIn 0.5s ease-out; }
        .mensaje-perdiste { color: #ef4444 !important; text-shadow: 0 0 15px #ef4444 !important; animation: popIn 0.5s ease-out; }

        .btn-reiniciar {
            padding: 14px 40px; background: linear-gradient(45deg, #7b2cbf, #3c096c); cursor: pointer; 
            border: 3px solid #c77dff; border-radius: 16px; color: white; font-weight: bold; font-size: 1.4rem; 
            margin-top: 25px; text-transform: uppercase; box-shadow: 0 0 20px #7b2cbf; font-family: 'Rajdhani', sans-serif;
            transition: 0.2s;
        }
        .btn-reiniciar:hover { transform: scale(1.05); box-shadow: 0 0 25px #c77dff; }
    </style>
</head>
<body>

    <audio id="zaard-audio" loop>

        <div id="status-msg">Seleccione su cofre con sabiduría...</div>
