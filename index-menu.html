<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAARD Arcade - Menú Principal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* Tu imagen con los botones integrados */
            background: url('https://raw.githubusercontent.com/figueredo56/ZAARD-Arcade/refs/heads/main/206%20sin%20t%C3%ADtulo_20260729130605_1.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Botón flotante de la billetera con la imagen del token */
        .wallet-float-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-image: url('https://raw.githubusercontent.com/figueredo56/index.html/main/Screenshot_20260724-221435_1.png');
            background-size: cover;
            background-position: center;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px #00ffcc;
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.2s ease;
            text-decoration: none;
        }
        .wallet-float-btn:hover {
            transform: scale(1.1);
        }

        /* Botones adaptados para coincidir con tu diseño visual */
        .btn-game {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            color: #00ff00;
            background: rgba(40, 0, 80, 0.75);
            border: 2px solid #00ffcc;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
        }
        .btn-game:hover, .btn-game:active {
            background: #00ffcc;
            color: #0d001a;
            transform: translateY(-2px);
        }
        .btn-back {
            background: rgba(80, 0, 40, 0.75);
            color: #ff0055;
            border-color: #ff0055;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3);
        }
        .btn-back:hover, .btn-back:active {
            background: #ff0055;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Acceso directo flotante a ZAARD Wallet -->
    <a href="https://figueredo56.github.io/zaard-wallet/wallet.html" class="wallet-float-btn" title="Ir a ZAARD Wallet"></a>

    <div class="container">
        <div style="height: 120px;"></div> <!-- Espacio superior para que respete el título de tu imagen -->
        
        <!-- Opciones de juegos (Ajusta los enlaces 'href' si tus archivos tienen nombres distintos en el repositorio) -->
        <a href="index-fenix.html" class="btn-game">🔥 Golden Run (Fénix)</a>
        <a href="index-memory.html" class="btn-game">🧩 Memory HD</a>
        <a href="index-combat.html" class="btn-game">⚔️ Combat</a>
        
        <!-- Botón para volver al Ecosistema general -->
        <a href="https://figueredo56.github.io/index.html/" class="btn-game btn-back">⬅ Volver al Ecosistema</a>
    </div>

</body>
</html>
