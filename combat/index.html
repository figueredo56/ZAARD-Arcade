<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZAARD COMBAT PRO</title>
    <!-- Ethers.js para lectura de Perfil / UI -->
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap');

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #020006; color: #fff; font-family: 'Rajdhani', sans-serif; 
            overflow: hidden; touch-action: none; user-select: none;
        }
        
        .espacio-bg {
            background-color: #020005;
            background-image: 
                radial-gradient(circle at 20% 25%, rgba(147, 51, 234, 0.35) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(34, 197, 94, 0.28) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(88, 28, 135, 0.4) 0%, transparent 55%),
                radial-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.08) 1px, transparent 15px),
                radial-gradient(rgba(34, 197, 94, 0.5), rgba(34, 197, 94, 0.03) 2px, transparent 35px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 29px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 220px 220px, 380px 380px, 290px 290px;
            background-position: 0 0, 0 0, 0 0, 15px 15px, 120px 160px, 50px 70px;
            background-attachment: fixed;
        }

        .screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; 
            background: linear-gradient(rgba(2,0,6,0.85), rgba(2,0,6,0.95)), url('https://ipfs.io/ipfs/bafybeibmhheisrjxpxpcsh6goj6c4pxraz5xkcizn4aiyl5eamdc5qyc3m'); 
            background-size: cover; background-position: center;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .btn { 
            padding: 15px 30px; margin: 10px; border: 2px solid #9333ea; background: rgba(0,0,0,0.85); color: #fff; 
            cursor: pointer; font-weight: bold; font-size: 1.1rem; border-radius: 12px; width: 80%; max-width: 320px; 
            text-align: center; transition: all 0.2s; font-family: 'Rajdhani', sans-serif;
            box-shadow: 0 0 15px rgba(147, 51, 234, 0.3);
        }
        .btn:active { background: #9333ea; transform: scale(0.95); }
        
        .neon-glow { text-shadow: 0 0 10px rgba(147, 51, 234, 0.7), 0 0 20px rgba(34, 197, 94, 0.5); }

        #canvasJuego { 
            display: none; width: 100%; height: 100%; background: transparent; position: absolute; top: 0; left: 0; z-index: 10;
        }

        #hud { 
            display: none; position: absolute; top: 15px; left: 15px; z-index: 50; 
            font-size: 1.1rem; pointer-events: none; background: rgba(0,0,0,0.85); 
            padding: 10px 15px; border-radius: 10px; border: 1px solid #9333ea;
            align-items: center; gap: 10px; box-shadow: 0 0 15px rgba(147,51,234,0.3);
        }

        #btn-emergencia {
            display: none; position: absolute; top: 75px; right: 15px; z-index: 50;
            background: rgba(220, 38, 38, 0.85); border: 2px solid #ef4444; color: #fff;
            padding: 8px 14px; border-radius: 10px; font-weight: bold; cursor: pointer;
            font-family: 'Rajdhani', sans-serif; font-size: 1rem; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }
        #btn-emergencia:active { background: #ef4444; transform: scale(0.95); }

        .user-badge {
            display: flex; align-items: center; gap: 10px; background: rgba(147, 51, 234, 0.25);
            padding: 8px 16px; border-radius: 30px; border: 1px solid rgba(147, 51, 234, 0.6); margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(147,51,234,0.3);
        }
        .user-badge img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid #a855f7; }
    </style>
</head>
<body class="espacio-bg">

    <!-- BIENVENIDA -->
    <div id="bienvenida" class="screen">
        <div class="user-badge" id="perfil-info" style="display:none;">
            <img id="avatar-img" src="" alt="Avatar">
            <span id="nombre-usuario" style="font-weight: bold; color: #c084fc; font-size: 1.2rem;"></span>
        </div>
        <h1 id="txt-titulo" style="color:#9333ea; font-size: 2.8rem; text-align: center; margin-bottom: 5px;" class="neon-glow">ZAARD COMBAT</h1>
        <p id="txt-desc" style="text-align: center; padding: 0 20px; color: #d1d5db; margin-bottom: 25px; font-size: 1.15rem; line-height: 1.4;">¡Conquista el ciberespacio! Destruye cada amenaza sin piedad y demuestra tu habilidad.</p>
        <button class="btn" onclick="irAlMenu()" id="btn-entrar">ENTRAR</button>
        <button class="btn" style="border-color: #555; color: #aaa; font-size: 0.9rem; padding: 10px;" onclick="irAlHub()" id="btn-volver">⬅ VOLVER AL HUB</button>
    </div>

    <!-- MENÚ DE JUEGO -->
    <div id="menu" class="screen" style="display:none;">
        <div class="user-badge" id="perfil-info-menu" style="display:none;">
            <img id="avatar-img-menu" src="" alt="Avatar">
            <span id="nombre-usuario-menu" style="font-weight: bold; color: #c084fc; font-size: 1.2rem;"></span>
        </div>
        <h2 id="txt-sel-apuesta" style="background:rgba(0,0,0,0.85); padding:12px 20px; border-radius: 12px; text-align: center; border: 1px solid #9333ea; margin-bottom: 20px;" class="neon-glow">SELECCIONA MODO DE JUEGO</h2>
        <button class="btn" onclick="iniciarJuego()" style="border-color: #22c55e;">INICIAR COMBATE</button>
        <button class="btn" style="border-color: #7c3aed; color: #d8b4fe; font-size: 0.9rem; padding: 10px; margin-top: 15px;" onclick="volverAlBienvenida()" id="btn-atras">⬅ VOLVER</button>
    </div>

    <!-- JUEGO Y HUD -->
    <div id="hud">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 5px;">
            <img id="hud-avatar" src="" alt="Avatar" style="width: 25px; height: 25px; border-radius: 50%; object-fit: cover; border: 1px solid #a855f7; display:none;">
            <span id="hud-nombre" style="color: #c084fc; font-weight: bold; font-size: 0.95rem;"></span>
        </div>
        <div><span id="txt-hud-tiempo">Tiempo:</span> <span id="timer">60</span>s | <span id="txt-hud-destruidos">Destruidos:</span> <span id="score">0</span></div>
    </div>
    
    <button id="btn-emergencia" onclick="salidaEmergencia()">🚨 SALIR</button>
    <canvas id="canvasJuego"></canvas>

    <script>
        const LS_IDIOMA = localStorage.getItem('zaard_lang') || 'es';
        
        const traducciones = {
            es: {
                titulo: "ZAARD COMBAT",
                desc: "¡Conquista el ciberespacio! Destruye cada amenaza sin piedad y demuestra tu habilidad.",
                entrar: "ENTRAR",
                volver: "⬅ VOLVER AL HUB",
                selApuesta: "SELECCIONA MODO DE JUEGO",
                atras: "⬅ VOLVER",
                tiempo: "Tiempo:",
                destruidos: "Destruidos:",
                msgTiempo: "¡TIEMPO AGOTADO! Redirigiendo al menú...",
                msgDerrota: "¡TE TOCARON! Misión fallida. Redirigiendo...",
                msgVictoria: "¡VICTORIA ÉPICA! Has completado el combate con éxito. Redirigiendo..."
            },
            en: {
                titulo: "ZAARD COMBAT",
                desc: "Conquer cyberspace! Destroy every threat without mercy and prove your skill.",
                entrar: "ENTER",
                volver: "⬅ BACK TO HUB",
                selApuesta: "SELECT GAME MODE",
                atras: "⬅ BACK",
                tiempo: "Time:",
                destruidos: "Destroyed:",
                msgTiempo: "TIME OUT! Redirecting to menu...",
                msgDerrota: "GOT HIT! Mission failed. Redirecting...",
                msgVictoria: "EPIC VICTORY! Combat successfully completed. Redirecting..."
            },
            zh: {
                titulo: "ZAARD 战斗",
                desc: "征服网络空间！毫不留情地消灭每一个威胁。",
                entrar: "进入",
                volver: "⬅ 返回大厅",
                selApuesta: "选择游戏模式",
                atras: "⬅ 返回",
                tiempo: "时间:",
                destruidos: "已消灭:",
                msgTiempo: "时间到！正在重定向...",
                msgDerrota: "被击中！任务失败。正在重定向...",
                msgVictoria: "史诗般的胜利！战斗成功完成。正在重定向..."
            }
        };

        const t = traducciones[LS_IDIOMA] || traducciones.es;

        document.getElementById('txt-titulo').innerText = t.titulo;
        document.getElementById('txt-desc').innerText = t.desc;
        document.getElementById('btn-entrar').innerText = t.entrar;
        document.getElementById('btn-volver').innerText = t.volver;
        document.getElementById('txt-sel-apuesta').innerText = t.selApuesta;
        document.getElementById('btn-atras').innerText = t.atras;
        document.getElementById('txt-hud-tiempo').innerText = t.tiempo;
        document.getElementById('txt-hud-destruidos').innerText = t.destruidos;

        // Cargar datos de usuario del almacenamiento local
        const usuarioGuardado = localStorage.getItem('zaard_nombre') || localStorage.getItem('usuario') || 'Piloto';
        const avatarGuardado = localStorage.getItem('zaard_avatar') || localStorage.getItem('avatar') || 'https://ipfs.io/ipfs/bafybeibmhheisrjxpxpcsh6goj6c4pxraz5xkcizn4aiyl5eamdc5qyc3m';
        
        if (usuarioGuardado) {
            document.getElementById('nombre-usuario').innerText = usuarioGuardado;
            document.getElementById('avatar-img').src = avatarGuardado;
            document.getElementById('perfil-info').style.display = 'flex';

            document.getElementById('nombre-usuario-menu').innerText = usuarioGuardado;
            document.getElementById('avatar-img-menu').src = avatarGuardado;
            document.getElementById('perfil-info-menu').style.display = 'flex';

            document.getElementById('hud-nombre').innerText = usuarioGuardado;
            document.getElementById('hud-avatar').src = avatarGuardado;
            document.getElementById('hud-avatar').style.display = 'block';
        }

        const canvas = document.getElementById('canvasJuego');
        const ctx = canvas.getContext('2d');
        
        const imgNave = new Image(); 
        imgNave.src = 'https://ipfs.io/ipfs/bafybeibmhheisrjxpxpcsh6goj6c4pxraz5xkcizn4aiyl5eamdc5qyc3m';

        const imgEnemigo1 = new Image();
        imgEnemigo1.src = 'https://raw.githubusercontent.com/figueredo56/ZAARD-Arcade/refs/heads/main/CC_20260621_144651.png';

        const imgEnemigo2 = new Image();
        imgEnemigo2.src = 'https://raw.githubusercontent.com/figueredo56/ZAARD-Arcade/refs/heads/main/CC_20260621_145200.png';
        
        let nave = { x: 0, y: 0, w: 55, h: 55 };
        let enemigos = [];
        let balas = [];
        let puntos = 0;
        let timeLeft = 60;
        let juegoActivo = false;
        let crono;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSnd(freq, dur, type = 'square') {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let o = audioCtx.createOscillator();
            let g = audioCtx.createGain();
            o.type = type;
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.08, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + dur);
        }

        function irAlHub() {
            window.location.href = 'https://figueredo56.github.io/ZAARD-Arcade/index-menu.html';
        }

        function irAlMenu() { 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            document.getElementById('bienvenida').style.display = 'none'; 
            document.getElementById('menu').style.display = 'flex'; 
        }

        function volverAlBienvenida() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('bienvenida').style.display = 'flex';
        }

        function salidaEmergencia() {
            juegoActivo = false;
            clearInterval(crono);
            document.getElementById('hud').style.display = 'none';
            document.getElementById('btn-emergencia').style.display = 'none';
            canvas.style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
        }

        function terminarJuego(resultado) { 
            juegoActivo = false; 
            clearInterval(crono); 

            if (resultado === 'victoria') {
                alert(t.msgVictoria);
            } else {
                alert(t.msgDerrota);
            }

            document.getElementById('hud').style.display = 'none';
            document.getElementById('btn-emergencia').style.display = 'none';
            canvas.style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
        }

        function iniciarJuego() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('btn-emergencia').style.display = 'block';
            canvas.style.display = 'block';
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight;
            
            nave.x = canvas.width / 2 - 27;
            nave.y = canvas.height - 120;
            puntos = 0;
            timeLeft = 60;
            document.getElementById('score').innerText = puntos;
            document.getElementById('timer').innerText = timeLeft;
            enemigos = [];
            balas = [];
            
            juegoActivo = true;
            
            crono = setInterval(() => { 
                if(!juegoActivo) return;
                if(timeLeft > 0) {
                    timeLeft--;
                    document.getElementById('timer').innerText = timeLeft;
                } else { 
                    terminarJuego('tiempo'); 
                }
            }, 1000);
            
            bucle(); 
        }

        window.addEventListener('touchmove', (e) => { 
            if(!juegoActivo) return;
            nave.x = e.touches[0].clientX - 27; 
            if(nave.x < 0) nave.x = 0;
            if(nave.x > canvas.width - 55) nave.x = canvas.width - 55;
        }, { passive: false });

        window.addEventListener('mousemove', (e) => {
            if(!juegoActivo) return;
            nave.x = e.clientX - 27;
            if(nave.x < 0) nave.x = 0;
            if(nave.x > canvas.width - 55) nave.x = canvas.width - 55;
        });

        function bucle() {
            if(!juegoActivo) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.drawImage(imgNave, nave.x, nave.y, nave.w, nave.h);

            if(Math.random() < 0.035) {
                enemigos.push({
                    x: Math.random() * (canvas.width - 45), 
                    y: -50,
                    velX: (Math.random() - 0.5) * 2.5, 
                    velY: 3.2 + Math.random() * 1.8, 
                    img: Math.random() > 0.5 ? imgEnemigo1 : imgEnemigo2,
                    rotacionSpeed: (Math.random() - 0.5) * 0.015
                });
            }
            
            for(let i = enemigos.length - 1; i >= 0; i--) {
                let e = enemigos[i];
                e.y += e.velY; 
                e.x += e.velX; 

                if (e.x < 0 || e.x > canvas.width - 45) {
                    e.velX *= -1;
                }
                
                ctx.save();
                ctx.translate(e.x + 22.5, e.y + 22.5);
                ctx.rotate((e.y * 0.015));
                ctx.drawImage(e.img, -22.5, -22.5, 45, 45);
                ctx.restore();
                
                if(e.x < nave.x + 45 && e.x + 45 > nave.x && e.y < nave.y + 55 && e.y + 45 > nave.y) {
                    playSnd(120, 0.4, 'sawtooth'); 
                    terminarJuego('derrota');
                    return;
                }
                
                if(e.y > canvas.height) enemigos.splice(i, 1);
            }
            
            if(Math.random() < 0.18) { 
                balas.push({x: nave.x + 25, y: nave.y});
                playSnd(450, 0.04, 'triangle'); 
            }
            
            for(let i = balas.length - 1; i >= 0; i--) {
                let b = balas[i];
                b.y -= 14; 
                ctx.fillStyle = '#22c55e'; 
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#22c55e';
                ctx.fillRect(b.x, b.y, 5, 15); 
                ctx.shadowBlur = 0; 
                
                let balaImpactada = false;
                
                for(let ei = enemigos.length - 1; ei >= 0; ei--) {
                    let e = enemigos[ei];
                    if(b.x > e.x && b.x < e.x+45 && b.y > e.y && b.y < e.y+45) {
                        enemigos.splice(ei, 1); 
                        balaImpactada = true;
                        puntos++;
                        document.getElementById('score').innerText = puntos;
                        playSnd(750, 0.08, 'sine'); 
                        
                        if(puntos >= 300) { 
                            terminarJuego('victoria'); 
                            return; 
                        }
                        break;
                    }
                }
                
                if(balaImpactada || b.y < 0) balas.splice(i, 1);
            }
            
            requestAnimationFrame(bucle);
        }
    </script>
</body>
</html>
