<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZAARD MEMORY ARCADE - Protocolo Panga</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0;
            background: #070112;
            overflow: hidden; 
            font-family: 'Arial', sans-serif; 
            color: #fff;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #070112; z-index: 2000;
            display: flex; justify-content: center; align-items: center; color: #00ffff; font-weight: bold;
        }

        /* Fondo dinámico más vivo y brillante usando otra textura IPFS más luminosa */
        .fondo-cosmico {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, rgba(61,16,107,0.85) 0%, rgba(23,4,47,0.9) 50%, rgba(7,1,18,0.95) 100%),
                        url('https://ipfs.io/ipfs/bafybeicugqjr3uy2mvk32536qi3gf3astpwj53nlbeogx3vmzsmk2ia3wa');
            background-size: cover;
            background-position: center;
            z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; text-align: center;
            transition: opacity 0.5s ease;
        }
        .fondo-cosmico.oculto {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        /* Caja translúcida más clara y luminosa (menos oscura) con marco que cambia de color y titila */
        .modal-card {
            background: linear-gradient(135deg, rgba(50, 15, 95, 0.75) 0%, rgba(25, 8, 50, 0.82) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 3px solid #00ffff; 
            border-radius: 22px;
            padding: 30px; width: 100%; max-width: 420px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            animation: borderGlowPulse 3s infinite alternate;
        }

        @keyframes borderGlowPulse {
            0% {
                border-color: #00ffff;
                box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), inset 0 0 15px rgba(0, 255, 255, 0.2);
            }
            33% {
                border-color: #d946ef;
                box-shadow: 0 0 30px rgba(217, 70, 239, 0.7), inset 0 0 20px rgba(217, 70, 239, 0.3);
            }
            66% {
                border-color: #10b981;
                box-shadow: 0 0 30px rgba(16, 185, 129, 0.7), inset 0 0 20px rgba(16, 185, 129, 0.3);
            }
            100% {
                border-color: #38bdf8;
                box-shadow: 0 0 25px rgba(56, 189, 248, 0.6), inset 0 0 15px rgba(56, 189, 248, 0.2);
            }
        }

        /* Estilos de tipografía solicitados: Títulos en degradé Morado/Azul, Descripciones en Verde brillante */
        .titulo-impacto {
            font-size: 25px;
            font-weight: 900;
            margin-top: 0;
            background: linear-gradient(90deg, #c084fc, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(192, 132, 252, 0.5);
            letter-spacing: 1px;
        }

        .subtitulo-impacto {
            font-size: 19px;
            font-weight: bold;
            margin: 12px 0;
            background: linear-gradient(90deg, #e879f9, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desc-verde {
            font-size: 15px;
            font-weight: bold;
            color: #4ade80; /* Verde brillante muy llamativo */
            text-shadow: 0 0 8px rgba(74, 222, 128, 0.4);
            margin-bottom: 25px; 
            line-height: 1.6;
        }

        .btn-accion {
            width: 100%; padding: 14px; margin: 12px 0; border: none; border-radius: 12px;
            font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-accion:hover { transform: scale(1.02); }
        .btn-aceptar { background: linear-gradient(90deg, #d946ef, #8b5cf6); color: #fff; box-shadow: 0 0 15px rgba(217, 70, 239, 0.5); }
        .btn-invitado { background: linear-gradient(90deg, #10b981, #059669); color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .btn-web3 { background: linear-gradient(90deg, #00ffff, #0088cc); color: #000; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        .btn-volver { background: linear-gradient(90deg, #ef4444, #b91c1c); color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>

<div id="loading-screen">CARGANDO PROTOCOLO...</div>

<!-- 1. PANTALLA DE BIENVENIDA IMPACTANTE -->
<div id="pantalla-bienvenida" class="fondo-cosmico">
    <div class="modal-card">
        <h1 class="titulo-impacto">⚡ PROTOCOLO PANGA ⚡</h1>
        <h2 class="subtitulo-impacto">¡PON A PRUEBA TU MEMORIA Y GANA ZARD!</h2>
        <p class="desc-verde">
            Desafía los 10 niveles cósmicos, supera los obstáculos y demuestra tu destreza en el arcade Web3 definitivo.
        </p>
        <button class="btn-accion btn-aceptar" onclick="irASeleccionModo()">¡ACEPTAR Y JUGAR! 🚀</button>
        <button class="btn-accion btn-volver" onclick="irAlMenuArcade()">⬅ MENÚ PRINCIPAL ARCADE</button>
    </div>
</div>

<!-- 2. PANTALLA DE SELECCIÓN DE MODO -->
<div id="pantalla-seleccion" class="fondo-cosmico oculto">
    <div class="modal-card">
        <h2 id="txt-titulo-sel" class="titulo-impacto">⚡ MODO DE JUEGO ⚡</h2>
        <p id="txt-desc-sel" class="desc-verde">
            Apuesta: 0.0001 ZARD<br>Premio: 0.00015 ZARD<br>Quema automática al perder.
        </p>
        <button class="btn-accion btn-invitado" onclick="elegirModo('invitado')">MODO INVITADO 🚀</button>
        <button class="btn-accion btn-web3" onclick="conectarYJugar()">CONECTAR BILLETERA WEB3</button>
        <button class="btn-accion btn-volver" onclick="volverABienvenida()">⬅ VOLVER</button>
    </div>
</div>

<script>
    const LS_NOMBRE = localStorage.getItem('zaard_nombre') || "Jugador Zaard";
    const LS_AVATAR_URL = localStorage.getItem('zaard_avatar') || 'https://raw.githubusercontent.com/figueredo56/ZAARD-Arcade/refs/heads/main/Gemini_Generated_Image_lhyyv2lhyyv2lhyy_1.png';
    const LS_IDIOMA = localStorage.getItem('zaard_lang') || 'es'; 

    const TOKEN_ADDR = "0x3468EA4e6CE13Ec4C7f8651f7eFC6AA6046F4d65"; 
    const BURN_WALLET = "0x000000000000000000000000000000000000dEaD"; 
    const ABI_TRANSFER = [{"constant":false,"inputs":[{"name":"_to","type":"address"},{"name":"_value","type":"uint256"}],"name":"transfer","outputs":[{"name":"","type":"bool"}],"type":"function"}];
    const APUESTA_WEI = "100000000000000"; 

    let web3, contract, userAccount, esModoWeb3 = false;
    let nivelActual = 1;
    const avatarImageKey = 'avatarUsr';
    let audioCtx = null;

    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function reproducirSonidoRetro(tipo) {
        try {
            initAudioContext();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (tipo === 'click') {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(600, now + 0.05);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (tipo === 'acierto') {
                let notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    let t = now + idx * 0.07;
                    let o = audioCtx.createOscillator();
                    let g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, t);
                    g.gain.setValueAtTime(0.15, t);
                    g.gain.linearRampToValueAtTime(0.01, t + 0.1);
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(t);
                    o.stop(t + 0.1);
                });
            } else if (tipo === 'error') {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (tipo === 'victoria') {
                let notes = [440, 554.37, 659.25, 880, 1108.73];
                notes.forEach((freq, idx) => {
                    let t = now + idx * 0.1;
                    let o = audioCtx.createOscillator();
                    let g = audioCtx.createGain();
                    o.type = 'square';
                    o.frequency.setValueAtTime(freq, t);
                    g.gain.setValueAtTime(0.15, t);
                    g.gain.linearRampToValueAtTime(0.01, t + 0.15);
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(t);
                    o.stop(t + 0.15);
                });
            }
        } catch(e) {
            console.log("Audio FX error:", e);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('loading-screen').style.display = 'none';

        if (LS_IDIOMA === 'zh') {
            document.querySelector('#pantalla-bienvenida h2').innerText = "测试你的记忆力并赢得 ZARD！";
            document.querySelector('#pantalla-bienvenida p').innerText = "挑战 10 个宇宙关卡，克服障碍，在终极 Web3 街机中证明你的技能。";
            document.querySelector('.btn-aceptar').innerText = "接受并开始！ 🚀";
            document.querySelector('.btn-volver').innerText = "⬅ 街机主菜单";
            document.getElementById('txt-titulo-sel').innerText = "⚡ 游戏模式 ⚡";
            document.getElementById('txt-desc-sel').innerHTML = "下注: 0.0001 ZARD<br>奖励: 0.00015 ZARD<br>失败时自动销毁。";
            document.querySelector('#pantalla-seleccion .btn-invitado').innerText = "游客模式 🚀";
            document.querySelector('#pantalla-seleccion .btn-web3').innerText = "连接 Web3 钱包";
        } else if (LS_IDIOMA === 'en') {
            document.querySelector('#pantalla-bienvenida h2').innerText = "TEST YOUR MEMORY & WIN ZARD!";
            document.querySelector('#pantalla-bienvenida p').innerText = "Challenge the 10 cosmic levels, overcome obstacles, and prove your skills in the ultimate Web3 arcade.";
            document.querySelector('.btn-aceptar').innerText = "ACCEPT & PLAY! 🚀";
            document.querySelector('.btn-volver').innerText = "⬅ ARCADE MAIN MENU";
            document.getElementById('txt-titulo-sel').innerText = "⚡ GAME MODE ⚡";
            document.getElementById('txt-desc-sel').innerHTML = "Bet: 0.0001 ZARD<br>Win: 0.00015 ZARD<br>Auto-burn on loss.";
            document.querySelector('#pantalla-seleccion .btn-invitado').innerText = "GUEST MODE 🚀";
            document.querySelector('#pantalla-seleccion .btn-web3').innerText = "CONNECT WEB3 WALLET";
        }
    });

    function irASeleccionModo() {
        reproducirSonidoRetro('click');
        document.getElementById('pantalla-bienvenida').classList.add('oculto');
        document.getElementById('pantalla-seleccion').classList.remove('oculto');
    }

    function volverABienvenida() {
        reproducirSonidoRetro('click');
        document.getElementById('pantalla-seleccion').classList.add('oculto');
        document.getElementById('pantalla-bienvenida').classList.remove('oculto');
    }

    function irAlMenuArcade() {
        reproducirSonidoRetro('click');
        window.location.href = "https://figueredo56.github.io/ZAARD-Arcade/index-menu.html";
    }

    function elegirModo(modo) {
        reproducirSonidoRetro('click');
        esModoWeb3 = false;
        document.getElementById('pantalla-seleccion').classList.add('oculto');
        iniciarPhaserGame();
    }

    async function conectarYJugar() {
        reproducirSonidoRetro('click');
        if (window.ethereum) {
            try {
                web3 = new Web3(window.ethereum);
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAccount = accounts[0];
                contract = new web3.eth.Contract(ABI_TRANSFER, TOKEN_ADDR);
                esModoWeb3 = true;
                alert(LS_IDIOMA === 'zh' ? "钱包已连接！" : (LS_IDIOMA === 'en' ? "Wallet connected successfully!" : "¡Billetera conectada con éxito!"));
                document.getElementById('pantalla-seleccion').classList.add('oculto');
                iniciarPhaserGame();
            } catch (e) { 
                alert(LS_IDIOMA === 'zh' ? "连接失败。" : (LS_IDIOMA === 'en' ? "Connection cancelled or failed." : "Conexión cancelada o fallida.")); 
            }
        } else { 
            alert(LS_IDIOMA === 'zh' ? "请安装 Web3 钱包。" : (LS_IDIOMA === 'en' ? "Please install MetaMask or a Web3 wallet." : "Por favor instala MetaMask o una billetera Web3.")); 
        }
    }

    async function ejecutarQuemaPorPerdida() {
        if (esModoWeb3 && contract && userAccount) {
            try {
                const msg = LS_IDIOMA === 'zh' ? "正在处理销毁交易..." : (LS_IDIOMA === 'en' ? "Processing burn transaction..." : "Procesando quema de 0.0001 ZARD...");
                const msgDiv = document.createElement('div');
                msgDiv.style.position = 'fixed'; msgDiv.style.top='50%'; msgDiv.style.left='50%';
                msgDiv.style.transform='translate(-50%, -50%)'; msgDiv.style.background='rgba(0,0,0,0.9)';
                msgDiv.style.color='#ff4444'; msgDiv.style.padding='20px'; msgDiv.style.borderRadius='15px';
                msgDiv.style.zIndex='3000'; msgDiv.style.fontWeight='bold';
                msgDiv.innerText = msg;
                document.body.appendChild(msgDiv);

                await contract.methods.transfer(BURN_WALLET, APUESTA_WEI).send({ from: userAccount });
                msgDiv.remove();
                alert(LS_IDIOMA === 'zh' ? "代币已销毁至 Dead 地址。" : (LS_IDIOMA === 'en' ? "Bet tokens sent to burn wallet." : "Tokens de apuesta enviados a la billetera de quema."));
            } catch (e) { 
                console.log("Error en quema:", e); 
            }
        }
    }

    function volverAlMenuSeleccion() {
        reproducirSonidoRetro('click');
        const canvasContainer = document.querySelector('canvas');
        if (canvasContainer) canvasContainer.remove();
        nivelActual = 1;
        document.getElementById('pantalla-seleccion').classList.remove('oculto');
    }

    function manejarVictoriaFinal(sceneRef) {
        reproducirSonidoRetro('victoria');
        let mensaje = `🌟 ¡MAGNÍFICO, ${LS_NOMBRE.toUpperCase()}! 🌟\n\n¡Has completado con éxito los 10 niveles del Protocolo Panga y ganado Gloria Cósmica y ZARD!`;
        if (LS_IDIOMA === 'en') mensaje = `🌟 MAGNIFICENT, ${LS_NOMBRE.toUpperCase()}! 🌟\n\nYou successfully completed all 10 levels and won cosmic glory!`;
        if (LS_IDIOMA === 'zh') mensaje = `🌟 太棒了，${LS_NOMBRE.toUpperCase()}！ 🌟\n\n您已成功通过所有 10 个关卡！`;
        
        alert(mensaje);
        volverAlMenuSeleccion();
    }

    async function manejarDerrota(sceneRef) {
        reproducirSonidoRetro('error');
        let mensaje = "¡Te has quedado sin oportunidades! Vuelve a intentarlo.";
        if (LS_IDIOMA === 'en') mensaje = "You lost all opportunities! Try again.";
        if (LS_IDIOMA === 'zh') mensaje = "您已失去所有机会！请再试一次。";

        if (esModoWeb3) {
            await ejecutarQuemaPorPerdida();
        }
        
        alert(mensaje);
        volverAlMenuSeleccion();
    }

    function iniciarPhaserGame() {
        const existingCanvas = document.querySelector('canvas');
        if (existingCanvas) existingCanvas.remove();

        new Phaser.Game({
            type: Phaser.AUTO, 
            width: window.innerWidth, 
            height: window.innerHeight,
            backgroundColor: '#070112',
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: 480,
                height: 800
            },
            scene: {
                preload: function() {
                    const cids = [
                        'bafybeifzkdoitiowwicqwnkfx6dnahydk5mm33h7r3j3wyv7c4rjp75ws4', 'bafybeiakl2nuugolggppxfttwcxfsv56zsjms4ityd5vjyyd54ctirzaeq', 
                        'bafybeicugqjr3uy2mvk32536qi3gf3astpwj53nlbeogx3vmzsmk2ia3wa', 'bafybeickwp5h3ew6bm4aim6r5v5sc5xha6h3hdsbrhja2zeruosphac5ba', 
                        'bafybeigxro3eht2lctrk4akglifsxuvwolwqfzgqzvnstabnpjjiungza4', 'bafybeidwy5yeihhglhcuztl32loatlk3wccecimodl6m4ocuotuuru7gvi', 
                        'bafybeiheko4izm53qfmhejmvz5elek4hb2lp3weaduwndvrvpxdamwklue', 'bafybeiggz26x26hncisti5s5y74ciuk4yuymtczhsbwdufoql2gidl57mu', 
                        'bafybeiginlvb63afmlicnvsx4fwfekanoipydzgzv3ay7njpvq6nm4zzym', 'bafybeie5wqjyuwdezpoe5tqkqlojxv5evtdkv6mxhondx5hvod44txbobq'
                    ];
                    cids.forEach((c, i) => this.load.image('c'+i, 'https://ipfs.io/ipfs/'+c));
                    this.load.image('dorso', 'https://ipfs.io/ipfs/bafybeibmhheisrjxpxpcsh6goj6c4pxraz5xkcizn4aiyl5eamdc5qyc3m');
                    this.load.image(avatarImageKey, LS_AVATAR_URL);
                },
                create: function() {
                    let sceneRef = this;
                    this.vidas = 12;
                    this.bloqueado = false;
                    this.primeraCarta = null;
                    
                    let bgGlow = this.add.circle(240, 400, 320, 0x3d106b, 0.35);
                    bgGlow.setBlendMode(Phaser.BlendModes.ADD);

                    for(let i=0; i<30; i++) {
                        let sx = Phaser.Math.Between(15, 465);
                        let sy = Phaser.Math.Between(15, 785);
                        let star = this.add.circle(sx, sy, Phaser.Math.FloatBetween(1, 2), 0xffffff, Phaser.Math.FloatBetween(0.2, 0.8));
                        this.tweens.add({
                            targets: star,
                            alpha: 0.1,
                            duration: Phaser.Math.Between(1200, 2500),
                            yoyo: true,
                            repeat: -1
                        });
                    }

                    // --- PANEL SUPERIOR ---
                    let panelBg = this.add.graphics();
                    panelBg.fillStyle(0x180536, 0.9);
                    panelBg.lineStyle(2, 0x00ffff, 0.8);
                    panelBg.fillRoundedRect(20, 15, 440, 80, 16);
                    panelBg.strokeRoundedRect(20, 15, 440, 80, 16);

                    this.avatarImg = this.add.image(65, 55, avatarImageKey).setDisplaySize(60, 60).setOrigin(0.5);
                    let avatarBorder = this.add.graphics();
                    avatarBorder.lineStyle(3, 0xd946ef, 1);
                    avatarBorder.strokeCircle(65, 55, 32);

                    this.txtNombre = this.add.text(115, 30, LS_NOMBRE, { fontSize: '18px', color: '#00ffff', fontStyle: 'bold' });
                    this.txtNivel = this.add.text(115, 58, (LS_IDIOMA === 'zh' ? "关卡: " : (LS_IDIOMA === 'en' ? "Level: " : "Nivel: ")) + `${nivelActual} / 10`, { fontSize: '15px', color: '#e879f9', fontStyle: 'bold' });
                    
                    this.txtVidas = this.add.text(435, 32, `❤️ ${this.vidas}`, { fontSize: '18px', color: '#f87171', fontStyle: 'bold' }).setOrigin(1, 0);

                    let txtMenuText = LS_IDIOMA === 'zh' ? "菜单" : (LS_IDIOMA === 'en' ? "MENU" : "MENÚ");
                    let btnMenu = this.add.text(435, 62, txtMenuText, { fontSize: '13px', color: '#38bdf8', fontStyle: 'bold' }).setOrigin(1, 0).setInteractive();
                    btnMenu.on('pointerdown', volverAlMenuSeleccion);

                    let txtArcadeText = LS_IDIOMA === 'zh' ? "街机" : (LS_IDIOMA === 'en' ? "ARCADE" : "ARCADE");
                    let btnArcade = this.add.text(370, 62, txtArcadeText, { fontSize: '13px', color: '#f43f5e', fontStyle: 'bold' }).setOrigin(1, 0).setInteractive();
                    btnArcade.on('pointerdown', irAlMenuArcade);

                    function construirTablero() {
                        if (sceneRef.cartasGroup) {
                            sceneRef.cartasGroup.destroy(true);
                        }
                        sceneRef.cartasGroup = sceneRef.add.group();

                        let totalPares = Math.min(4 + nivelActual, 10);
                        let deck = []; 
                        for(let i = 0; i < totalPares; i++) { deck.push(i, i); }
                        Phaser.Utils.Array.Shuffle(deck);
                        
                        let cols = 4;
                        let cardSize = 78; 
                        let spacingX = 90;
                        let spacingY = 90;
                        
                        let startX = 240 - (((cols - 1) * spacingX) / 2);
                        let startY = 210; 
                        
                        deck.forEach((val, idx) => {
                            let r = Math.floor(idx / cols);
                            let c = idx % cols;
                            let posX = startX + c * spacingX;
                            let posY = startY + r * spacingY;
                            
                            let carta = sceneRef.add.sprite(posX, posY, 'dorso').setDisplaySize(cardSize, cardSize).setInteractive();
                            carta.val = val;
                            carta.revelada = false;
                            sceneRef.cartasGroup.add(carta);
                            
                            carta.on('pointerdown', () => {
                                if (sceneRef.bloqueado || carta.revelada || carta === sceneRef.primeraCarta) return;
                                reproducirSonidoRetro('click');
                                carta.setTexture('c' + carta.val);
                                
                                if (!sceneRef.primeraCarta) {
                                    sceneRef.primeraCarta = carta;
                                } else {
                                    sceneRef.bloqueado = true;
                                    let primera = sceneRef.primeraCarta;
                                    sceneRef.primeraCarta = null;
                                    
                                    if (primera.val === carta.val) {
                                        reproducirSonidoRetro('acierto');
                                        primera.revelada = true;
                                        carta.revelada = true;
                                        sceneRef.bloqueado = false;
                                        
                                        let todasResueltas = true;
                                        sceneRef.cartasGroup.children.iterate((item) => {
                                            if (item && !item.revelada) todasResueltas = false;
                                        });
                                        
                                        if (todasResueltas) {
                                            if (nivelActual >= 10) {
                                                manejarVictoriaFinal(sceneRef);
                                            } else {
                                                nivelActual++;
                                                sceneRef.time.delayedCall(800, () => {
                                                    sceneRef.txtNivel.setText((LS_IDIOMA === 'zh' ? "关卡: " : (LS_IDIOMA === 'en' ? "Level: " : "Nivel: ")) + `${nivelActual} / 10`);
                                                    construirTablero();
                                                });
                                            }
                                        }
                                    } else {
                                        reproducirSonidoRetro('error');
                                        sceneRef.vidas--;
                                        sceneRef.txtVidas.setText(`❤️ ${sceneRef.vidas}`);
                                        
                                        sceneRef.time.delayedCall(800, () => {
                                            primera.setTexture('dorso');
                                            carta.setTexture('dorso');
                                            sceneRef.bloqueado = false;
                                            
                                            if (sceneRef.vidas <= 0) {
                                                manejarDerrota(sceneRef);
                                            }
                                        });
                                    }
                                }
                            });
                        });
                    }

                    construirTablero();
                }
            }
        });
    }
</script>

</body>
</html>
