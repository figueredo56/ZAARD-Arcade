<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAARD Innovation - Caja Misteriosa Web3</title>
    <!-- Incluimos ethers.js para la conexión con la Web3 -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --primary-color: #f3ba2f;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        #connectWallet {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        #connectWallet:hover {
            opacity: 0.8;
        }
        .info-panel {
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            border: 1px solid #333;
        }
        .grid-cajas {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
            width: 100%;
        }
        .caja {
            background-color: var(--card-bg);
            border: 2px solid #444;
            border-radius: 12px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s ease;
        }
        .caja:hover:not(.abierta) {
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .caja.abierta {
            cursor: default;
        }
        .caja.ganadora {
            background-color: #1b5e20;
            border-color: #4caf50;
        }
        .caja.perdedora {
            background-color: #b71c1c;
            border-color: #f44336;
        }
        #mensaje {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            min-height: 30px;
        }
        @media (max-width: 600px) {
            .grid-cajas {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>ZAARD Mystery Box</h1>
        <p>Apuesta <strong>0.00001 BNB</strong> y gana <strong>0.5 ZARD</strong> si encuentras la caja correcta</p>
    </header>

    <button id="connectWallet" onclick="conectarWallet()">Conectar Wallet</button>

    <div class="info-panel">
        <p id="walletStatus">Wallet: Desconectada</p>
        <p>Contrato ZARD: <small>0x3468ea4e6ce13ec4c7f8651f7efc6aa6046f4d65</small></p>
    </div>

    <div class="grid-cajas" id="gridCajas">
        <!-- Se generan dinámicamente las 12 cajas -->
    </div>

    <div id="mensaje"></div>

    <script>
        let provider, signer, userAddress;
        const ZARD_CONTRACT_ADDRESS = "0x3468ea4e6ce13ec4c7f8651f7efc6aa6046f4d65";
        const APUESTA_BNB = ethers.utils.parseEther("0.00001");
        const CAJA_GANADORA = 4; // La caja número 4 es la ganadora predeterminada

        // ABI estándar mínimo para recibir BNB (función receive/fallback) y transferencias de tokens si fuera necesario
        const ZARD_ABI = [
            "function balanceOf(address account) view returns (uint256)",
            "function transfer(to, amount) returns (bool)"
        ];

        async function conectarWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    userAddress = await signer.getAddress();
                    
                    document.getElementById("walletStatus").innerText = `Conectado: ${userAddress.substring(0,6)}...${userAddress.substring(38)}`;
                    document.getElementById("connectWallet").innerText = "Wallet Conectada";
                    document.getElementById("connectWallet").style.backgroundColor = "#4caf50";
                    
                    inicializarJuego();
                } catch (error) {
                    console.error(error);
                    alert("Error al conectar la wallet.");
                }
            } else {
                alert("Por favor, instala MetaMask o usa un navegador Web3 móvil (como Trust Wallet / BitKeep).");
            }
        }

        function inicializarJuego() {
            const grid = document.getElementById("gridCajas");
            grid.innerHTML = "";

            for (let i = 1; i <= 12; i++) {
                const caja = document.createElement("div");
                caja.className = "caja";
                caja.innerHTML = `📦<br><span style="font-size: 12px;">#${i}</span>`;
                caja.onclick = () => seleccionarCaja(i, caja);
                grid.appendChild(caja);
            }
            document.getElementById("mensaje").innerText = "¡Elige una caja para probar tu suerte!";
        }

        async function seleccionarCaja(numeroCaja, elementoCaja) {
            if (!signer) {
                alert("Primero debes conectar tu Wallet.");
                return;
            }

            const mensajeEl = document.getElementById("mensaje");

            try {
                mensajeEl.innerText = "Enviando apuesta de 0.00001 BNB...";
                
                // Transacción para enviar los 0.00001 BNB al contrato del juego / creador
                const tx = await signer.sendTransaction({
                    to: ZARD_CONTRACT_ADDRESS,
                    value: APUESTA_BNB
                });

                mensajeEl.innerText = "Esperando confirmación de la red...";
                await tx.wait();

                // Revelar resultado
                if (numeroCaja === CAJA_GANADORA) {
                    elementoCaja.className = "caja abierta ganadora";
                    elementoCaja.innerHTML = `🎉<br><span style="font-size: 12px;">¡Ganaste!</span>`;
                    mensajeEl.innerText = "¡Felicidades! Has encontrado la caja ganadora #4. (Reclama tus 0.5 ZARD con el administrador).";
                } else {
                    elementoCaja.className = "caja abierta perdedora";
                    elementoCaja.innerHTML = `❌<br><span style="font-size: 12px;">Vacía</span>`;
                    mensajeEl.innerText = `Lo siento, era la caja #${numeroCaja}. ¡Inténtalo de nuevo!`;
                }

                // Deshabilitar todas las cajas tras la jugada
                const cajas = document.querySelectorAll(".caja");
                cajas.forEach(c => c.onclick = null);

                // Botón para reiniciar partida
                setTimeout(() => {
                    const btnReiniciar = document.createElement("button");
                    btnReiniciar.innerText = "Jugar de nuevo";
                    btnReiniciar.style.marginTop = "15px";
                    btnReiniciar.style.padding = "8px 15px";
                    btnReiniciar.style.cursor = "pointer";
                    btnReiniciar.onclick = inicializarJuego;
                    mensajeEl.appendChild(document.createElement("br"));
                    mensajeEl.appendChild(btnReiniciar);
                }, 1000);

            } catch (error) {
                console.error(error);
                mensajeEl.innerText = "Transacción cancelada o fallida.";
            }
        }
    </script>
</body>
</html>
